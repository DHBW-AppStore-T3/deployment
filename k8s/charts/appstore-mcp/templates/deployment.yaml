apiVersion: apps/v1
kind: Deployment
metadata:
  name: appstore-mcp
  labels: {{- include "mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The SQLite volume is ReadWriteOnce: never two pods at once.
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "mcp.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mcp.labels" . | nindent 8 }}
    spec:
      serviceAccountName: appstore-mcp
      enableServiceLinks: false
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: appstore-mcp
          image: {{ include "mcp.image" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000, protocol: TCP }
          env:
            - { name: MCP_PUBLIC_URL, value: {{ printf "https://%s" (required "host is required" .Values.host) | quote }} }
            - { name: ZONE, value: {{ required "zone is required" .Values.zone | quote }} }
            - { name: DEFAULT_ENV, value: {{ .Values.environment | quote }} }
            - { name: GITHUB_ORG, value: {{ .Values.githubOrg | quote }} }
            - { name: READABLE_NAMESPACES, value: {{ join "," .Values.readableNamespaces | quote }} }
            - { name: DATA_DIR, value: /data }
            - name: TOKEN_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: token-signing-key, optional: true } }
            - name: STATIC_TOKENS
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: static-tokens, optional: true } }
            - name: GITHUB_CLIENT_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: github-client-id, optional: true } }
            - name: GITHUB_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: github-client-secret, optional: true } }
            - name: GITHUB_API_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: github-api-token, optional: true } }
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: appstore-mcp-data }
          {{- else }}
          emptyDir: { sizeLimit: 64Mi }
          {{- end }}
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appstore-mcp-data
  labels: {{- include "mcp.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.persistence.size }} }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: appstore-mcp
  labels: {{- include "mcp.labels" . | nindent 4 }}
spec:
  selector: {{- include "mcp.selector" . | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http, protocol: TCP }
---
# TLS ends at the ingress controller; no secretName: its default certificate
# (the cluster's wildcard certificate).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appstore-mcp
  labels: {{- include "mcp.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: appstore-mcp
                port: { name: http }
  tls:
    - hosts: [{{ .Values.host }}]
