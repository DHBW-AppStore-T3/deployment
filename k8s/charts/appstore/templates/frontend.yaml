{{- $comp := dict "context" . "component" "frontend" -}}
{{- $name := include "appstore.name" $comp -}}
{{- $v := .Values.frontend -}}
# The Vue frontend, and under /api the gateway to the API (API_UPSTREAM):
# nginx strips the prefix and answers /api/internal/ with 404, so the one
# Ingress of the host routes both. Read-only root filesystem; the runtime
# configuration goes to /tmp/runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "appstore.labels" $comp | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels: {{- include "appstore.selectorLabels" $comp | nindent 6 }}
  template:
    metadata:
      labels: {{- include "appstore.labels" $comp | nindent 8 }}
    spec:
      {{- include "appstore.podDefaults" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "appstore.image" (dict "context" . "key" "frontend" "name" "frontend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            - { name: VITE_APP_URL, value: {{ printf "https://%s" .Values.host | quote }} }
            - { name: VITE_API_URL, value: /api }
            - { name: VITE_KEYCLOAK_URL, value: {{ printf "https://%s" .Values.ssoHost | quote }} }
            - { name: VITE_KEYCLOAK_REALM, value: {{ .Values.keycloak.realm | quote }} }
            - { name: VITE_KEYCLOAK_CLIENT_ID, value: {{ .Values.keycloak.frontendClientId | quote }} }
            - { name: VITE_THEME, value: {{ $v.theme | quote }} }
            - { name: FRAME_ANCESTORS, value: {{ $v.frameAncestors | quote }} }
            - { name: API_UPSTREAM, value: {{ printf "%s:8000" (include "appstore.name" (dict "context" . "component" "api")) | quote }} }
          securityContext: {{- include "appstore.restricted" . | nindent 12 }}
          resources: {{- toYaml $v.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "appstore.labels" $comp | nindent 4 }}
spec:
  selector: {{- include "appstore.selectorLabels" $comp | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "appstore.labels" $comp | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "appstore.selectorLabels" $comp | nindent 6 }}
---
# TLS ends at the ingress controller; no secretName: its default certificate
# (the cluster's wildcard certificate).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{- include "appstore.labels" $comp | nindent 4 }}
spec:
  {{- with $v.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "host is required" .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: { name: http }
  tls:
    - hosts: [{{ .Values.host }}]
