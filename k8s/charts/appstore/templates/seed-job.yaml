{{- if .Values.seed.enabled }}
{{- $comp := dict "context" . "component" "seed" -}}
# Demo data (files/seed.py): the realm's users in the database, a demo course
# and a few catalog apps, so the UIs are usable right after a fresh rollout.
# After every sync (Helm post-install/post-upgrade = Argo CD PostSync hook),
# idempotent; the backend image, as the database owner, like the migrations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appstore.name" $comp }}
  labels: {{- include "appstore.labels" $comp | nindent 4 }}
data:
  seed.py: |-
{{ .Files.Get "files/seed.py" | indent 4 }}
  seed.json: |-
{{ dict "courseName" .Values.seed.courseName "apps" .Values.seed.apps | toPrettyJson | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "appstore.name" $comp }}
  labels: {{- include "appstore.labels" $comp | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {{- include "appstore.labels" $comp | nindent 8 }}
    spec:
      {{- include "appstore.podDefaults" . | nindent 6 }}
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: {{ include "appstore.image" (dict "context" . "key" "backend" "name" "backend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "/seed/seed.py"]
          workingDir: /app
          env:
            {{- include "appstore.backendEnv" . | nindent 12 }}
            - { name: PYTHONPATH, value: /app }
          securityContext: {{- include "appstore.restricted" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: seed, mountPath: /seed, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: seed
          configMap: { name: {{ include "appstore.name" $comp }} }
{{- end }}
