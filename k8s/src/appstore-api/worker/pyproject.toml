[project]
name = "appstore-worker"
version = "0.0.0"
description = "AppStore worker: runs OpenTofu/Packer jobs for deployments"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "appstore-shared",
    "sqlalchemy>=2.0.23",
    "psycopg[binary]>=3.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.4.0",
    "gitpython>=3.1.55",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["appstore_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # No single test may freeze the run (a git clone that escaped its mock, a
    # broker connection that was not faked). "thread" because the default
    # "signal" method cannot interrupt subprocess waits.
    "--timeout=60",
    "--timeout-method=thread",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["appstore_worker"]
