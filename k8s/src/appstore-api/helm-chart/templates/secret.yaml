{{- if not .Values.appstore.existingSecret }}
{{- $comp := dict "context" . "component" "" -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appstore.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appstore.labels" $comp | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.appstore.databaseUrl | quote }}
  # Comma-separated for rotation: the first encrypts, all decrypt.
  credential-encryption-key: {{ .Values.appstore.credentialEncryptionKey | quote }}
  # Always rendered, empty for roleProvider.type=mock or a relay without
  # login: the chart's Secret has to be a complete substitute for an
  # existingSecret, and the deployment reads these keys as optional.
  role-provider-api-token: {{ .Values.appstore.roleProvider.apiToken | default "" | quote }}
  smtp-password: {{ .Values.appstore.smtp.password | default "" | quote }}
{{- end }}
