[project]
name = "appstore-shared"
version = "0.0.0"
description = "Code shared by the AppStore API and worker"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=42.0.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["appstore_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
