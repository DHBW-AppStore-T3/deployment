# Set per environment through k8s/environments/<env>.yaml (see argocd/apps-chart).
appHost: appstore.example.org     # public host of the UI (the OIDC client's redirect target)
ssoHost: sso.example.org          # public host of Keycloak
# Demo users in realm dhbw (password: keycloak-secret demo-password). Staging only.
demoUsers: false
# Realms routed on the public host; the master realm and the admin console
# are reachable only through kubectl port-forward svc/keycloak 8080 (then
# http://localhost:8080/admin/) unless publicAdmin is set.
publicRealms: [dhbw, appstore]
publicAdmin: false
