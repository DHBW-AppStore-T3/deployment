# One CloudNativePG cluster for the environment. Databases:
#   appstore_t3   our AppStore: catalogue, job queue, task events, OpenTofu
#                 state of the VM deployments. Owner appstore_t3 (API,
#                 migrations); role appstore_worker (both workers) gets only
#                 the rights the migrations grant it.
#   keycloak      Keycloak.
# The login secrets are created by bootstrap.sh, never committed.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  instances: 1
  storage: { size: 5Gi }
  managed:
    roles:
      - { name: keycloak, login: true, passwordSecret: { name: keycloak-db } }
      - { name: appstore_t3, login: true, passwordSecret: { name: appstore-t3-db } }
      # Queue, task events and task results only (migration 5e1f0c2a9b7d);
      # no CREATEROLE needed anywhere, CNPG gives it its login.
      - { name: appstore_worker, login: true, passwordSecret: { name: appstore-worker-db } }
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  cluster: { name: postgres-cluster }
  name: keycloak
  owner: keycloak
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: appstore-t3
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  cluster: { name: postgres-cluster }
  name: appstore_t3
  owner: appstore_t3
