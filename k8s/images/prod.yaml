# Image digests of prod (written by .github/workflows/k8s-bump.yml, never by hand,
# except to roll back). The component CIs of backend, worker and frontend
# push to ghcr.io on every push to `main` and dispatch the bump with the
# digest they pushed; Argo CD's prod-appstore rolls out what is here. The
# comment behind a digest is the tag (sha-<commit>) it was built from.
images:
  tags:
    backend: "sha256:5f49cfcb28a182c76083df3e37296232ce256f1cd6ccfb8665c4c97cb0c841f2"  # sha-4784eb5
    workerPods: "sha256:de6348fdcb03f340a7db25b41ce502f840c9919b7c709141b863f574ab6f5410"  # sha-b1683d8
    frontend: "sha256:4398c24164e8b1407e290d65f0f0cb25d0b728c23a6eed255f6815daf095ab02"  # sha-c65eb2b
    appstoreMcp: "sha256:f41e4196494db8e8b411af788fdd4fb7010f248581accdb4b4a6ffb938415e6c"  # sha-95135cd
    # Empty until the first image of the self-service-ui repository is rolled out
    # (the chart renders the component only with a digest).
    selfServiceUi: "sha256:e2aa3534681c48978f201350b38e5f829063dd567c091fe884259e4547c7584e"  # sha-728d910
    moodle: "sha256:e887fcd3d18fd60dc452b69539d409b75b93649c3fcea88f5d45366a0e0fc892"  # sha-72efa1e
