# Image digests of staging (written by .github/workflows/k8s-bump.yml, never by hand,
# except to roll back). The component CIs of backend, worker and frontend
# push to ghcr.io on every push to `dev` and dispatch the bump with the
# digest they pushed; Argo CD's staging-appstore rolls out what is here. The
# comment behind a digest is the tag (sha-<commit>) it was built from.
images:
  tags:
    backend: "sha256:06ae6300bd98ad7d84a4e0d40f1ae8d8c736252b5df6ef4008cd2d4e2ab1e59d"  # sha-3bf49e1
    workerPods: "sha256:0c8cc3b2636c99649174d02694a2a816aca56a80a0895c3719fa35ed5efc2471"  # sha-a1c3700
    frontend: "sha256:3000e6a5d4118e22c7742fa820c0d0e963feab40a0dc8dbbcef8ce19dca87aff"  # sha-8e60443
    appstoreMcp: "sha256:2e88b8683f222c85a5acde4a7fb31156a171d3ce9cd6cab560cb1b9fde1e60d2"  # sha-0094804
    # Empty until the first image of the self-service-ui repository is rolled out
    # (the chart renders the component only with a digest).
    selfServiceUi: "sha256:aeaa1422160ae7df72e02d3622e9bbde4ebff59a83817f9e30cb219d305f11c9"  # sha-9a4e47a
    moodle: "sha256:90b8e57aaed2db36b5fb7bdaa6d4600e6f0af99f6e56522f7826890f19bb45b0"  # sha-e60f8f4
    # noVNC proxy of kubevirt-vm deployments (docker/novnc-proxy, bumped by its workflow).
    # Empty until the first bump: the chart then falls back to the unpinned :latest.
    novncProxy: "sha256:c8c0ac2915afdda55d75f2c1c50fcc9037af33994e5ca5a4e8868188b6059f51"  # sha-5553b9c
