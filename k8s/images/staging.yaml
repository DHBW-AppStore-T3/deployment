    workerPods: "sha256:cf48eaf401d7fb242aa0d902e0bf9b17bd13760c36d10cd40132030aacd3bbae"  # sha-d21c578
    frontend: "sha256:bf85d162bddd10288ad5f13b4456fd69e71225ea7ef465b7b432d4dd6a0687bb"  # sha-f2532fe
    appstoreMcp: "sha256:4b3992741bae983fa2275d5ca322b21f14b5fe22154630fa52157985487727f3"  # sha-3013285
    # Empty until the first image of the self-service-ui repository is rolled out
