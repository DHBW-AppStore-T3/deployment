# Image digests of staging (written by .github/workflows/k8s-bump.yml, never by hand,
# except to roll back). The component CIs of backend, worker and frontend
# push to ghcr.io on every push to `dev` and dispatch the bump with the
# digest they pushed; Argo CD's staging-appstore rolls out what is here. The
# comment behind a digest is the tag (sha-<commit>) it was built from.
images:
  tags:
    backend: "sha256:7a3640e7242b85cc1ca8a635cee38ce69b28108d4dba8e7b8527f9bbecd5321a"  # sha-53dacde
    worker: "sha256:04370595b3ff14f27d92aec6c86056f22acd03edb532ea59b4cb139cca2e1d73"  # sha-3f53a95
    workerPods: "sha256:1928982b607e90fa887d41100b69ddc6e5c32e9ad616564b4fa7d53eb8a9387d"  # sha-3f53a95
    frontend: "sha256:400c52fa8f4a7ae6035dff7c0fc0c51fc7113b323efd811a02c965cbc6313d70"  # sha-d8b316f
    appstoreMcp: "sha256:351a19c9e60be24787287b3b760bbab752eb9a8c25dbadb416f04aa27ba3b97e"  # sha-e05f290
    # Empty until the first image of the self-service-ui repository is rolled out
    # (the chart renders the component only with a digest).
    selfServiceUi: "sha256:b8c84b0d115e8eadbd689717791fa2c6b3699b175e0153d5745300946afe0405"  # sha-2d9fb79
