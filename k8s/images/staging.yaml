    workerPods: "sha256:9929b96620789f7bdc259cfc55783c413640875a490bf69804863c0d37c928fb"  # sha-43d1b97
    frontend: "sha256:b9afcda48296bd611903e0ef5dc6c5c52fb46ec71a71c7fb94248157cec4e93e"  # sha-77c7e92
    appstoreMcp: "sha256:351a19c9e60be24787287b3b760bbab752eb9a8c25dbadb416f04aa27ba3b97e"  # sha-e05f290
    # Empty until the first image of the self-service-ui repository is rolled out
