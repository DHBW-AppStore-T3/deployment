# Image digests of staging (written by .github/workflows/k8s-bump.yml, never by hand,
# except to roll back). The component CIs of backend, worker and frontend
# push to ghcr.io on every push to `dev` and dispatch the bump with the
# digest they pushed; Argo CD's staging-appstore rolls out what is here. The
# comment behind a digest is the tag (sha-<commit>) it was built from.
images:
  tags:
    backend: "sha256:46dc435e4f4c835a55ace6e6311f8714889aab8e8c186395ff84adeb6c1bf8ec"  # sha-cafa60c
    workerPods: "sha256:3522991bb26e6e41bb8cdd56f64fd23b47b40d76de4a87246ee52977fb2d3cc8"  # sha-e474de4
    frontend: "sha256:6e46f4ead4047cd205e54b7433870f4560de98746e1f14ef6d93010d8e4d5874"  # sha-2230964
    appstoreMcp: "sha256:4b3992741bae983fa2275d5ca322b21f14b5fe22154630fa52157985487727f3"  # sha-3013285
    # Empty until the first image of the self-service-ui repository is rolled out
    # (the chart renders the component only with a digest).
    selfServiceUi: "sha256:fb2100dfd5dcaca4390cbfffa0dc759f38ce4880daa92ecdee8f21999aebc987"  # sha-1e67bd1
    moodle: "sha256:337a94c5dab5b23db310e8ca62e57ff0674d89bfe8a0df26b39e6ca2aefef931"  # sha-f13fc38
