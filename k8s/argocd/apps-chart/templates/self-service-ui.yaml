apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env.name }}-self-service-ui
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.env.branch }}
    path: k8s/src/self-service-ui/helm-chart
    helm:
      valueFiles: [../../../env/self-service-ui.yaml]
      values: |
        fullnameOverride: self-service-ui
        selfServiceUI:
          hostname: {{ .Values.env.host }}
          image: ghcr.io/dhbw-appstore-t3/k8s-self-service-ui
          imagePullPolicy: IfNotPresent
          # Only the AppStore section is wired up; DNS and projects tabs stay hidden.
          dynamicZonesBaseUrl: https://unused.invalid
          cloudResourcesBaseUrl: ""
          appstoreBaseUrl: /api/appstore
          appstoreUpstream: appstore-api:8000
        auth:
          oidc:
            issuerUrl: https://{{ .Values.env.ssoHost }}/realms/appstore
            clientId: appstore
            authorizationUrl: https://{{ .Values.env.ssoHost }}/realms/appstore/protocol/openid-connect/auth
            tokenUrl: https://{{ .Values.env.ssoHost }}/realms/appstore/protocol/openid-connect/token
            jwksUrl: https://{{ .Values.env.ssoHost }}/realms/appstore/protocol/openid-connect/certs
            endSessionUrl: https://{{ .Values.env.ssoHost }}/realms/appstore/protocol/openid-connect/logout
        ingress: { enabled: false }       # the BFF owns the public host
        bff:
          enabled: true
          existingSecret: oauth2-proxy-ui-secret   # client-id, client-secret, cookie-secret
          whitelistDomains: [{{ .Values.env.ssoHost }}]
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.env.namespace }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
