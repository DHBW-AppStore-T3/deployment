apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env.name }}-role-provider-service
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  project: default
  source:
    repoURL: ghcr.io/pfisterer/charts      # OCI registry (public)
    chart: role-provider-service
    targetRevision: {{ .Values.roleProvider.chartVersion | quote }}
    helm:
      values: |
        fullnameOverride: role-provider-service
        roleProviderService:
          hostname: role-provider.{{ .Values.env.host }}
          # Persistent (CNPG database roleprovider). Groups and members are
          # filled by the seed Job.
          db: { type: postgres }
          existingSecret: role-provider-secret   # keys: db-connection-string, api-tokens, api-write-tokens
          groupRelations: [dozent, studierende]
        # Only appstore-api talks to it, in-cluster.
        ingress: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.env.namespace }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
