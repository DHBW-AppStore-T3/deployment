{{- if .Values.moodle.enabled }}
# Moodle (our moodle_appstore fork): web, cron, volume, ingress. The image
# digest comes from k8s/images/<env>.yaml (key moodle), the database from the
# platform application (wave 1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env.name }}-moodle
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "3" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.env.branch }}
    path: k8s/charts/moodle
    helm:
      valueFiles: [../../images/{{ .Values.env.name }}.yaml]
      values: |
        {{- /* The LTI tool matches the AppStore's LTI13_* settings (appstore.api.lti) */}}
        {{- $lti := dig "api" "lti" dict .Values.appstore }}
        {{- $moodle := mergeOverwrite (dict "lti" (dict "appstoreHost" .Values.env.host "clientId" ($lti.clientId | default "") "deploymentId" ($lti.deploymentId | default ""))) (deepCopy .Values.moodle) }}
        {{- toYaml $moodle | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.env.namespace }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
{{- end }}
