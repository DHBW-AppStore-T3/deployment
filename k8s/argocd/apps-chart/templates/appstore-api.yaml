apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env.name }}-appstore-api
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.env.branch }}
    path: k8s/src/appstore-api/helm-chart
    helm:
      valueFiles: [../../../env/appstore-api.yaml]
      values: |
        fullnameOverride: appstore       # Services appstore-api / appstore-worker
        appstore:
          existingSecret: appstore-secret
          simulate: {{ .Values.appstore.simulate }}
          api:
            image: ghcr.io/dhbw-appstore-t3/k8s-appstore-api
            mode: {{ .Values.appstore.mode }}
            uiUrl: https://{{ .Values.env.host }}
            adminGroups: "group:root_uni"
          worker:
            image: ghcr.io/dhbw-appstore-t3/k8s-appstore-worker
          podApps:
            enabled: {{ .Values.podApps.enabled }}
            zone: {{ .Values.podApps.zone | quote }}
            appDomain: {{ .Values.podApps.appDomain | quote }}
            imageRegistryAllowlist: {{ .Values.podApps.imageRegistryAllowlist | quote }}
            clusterIssuer: {{ .Values.podApps.clusterIssuer | quote }}
            extraEgressExcept: {{ .Values.podApps.extraEgressExcept | toJson }}
          oidc:
            issuerUrl: https://{{ .Values.env.ssoHost }}/realms/appstore
            clientId: appstore
            jwksUrl: https://{{ .Values.env.ssoHost }}/realms/appstore/protocol/openid-connect/certs
          roleProvider:
            type: http
            url: http://role-provider-service:8085
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.env.namespace }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
