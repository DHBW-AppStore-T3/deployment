# Seeds roles (Dozent, students, admin) into role-provider-service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env.name }}-role-provider-seed
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "4" }
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.env.branch }}
    path: k8s/manifests/seed
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.env.namespace }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
