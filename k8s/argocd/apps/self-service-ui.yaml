apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-service-ui
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  project: default
  source:
    repoURL: https://github.com/DHBW-AppStore-T3/deployment.git
    targetRevision: spike/k8s
    path: k8s/src/self-service-ui/helm-chart
    helm:
      valueFiles: [../../../env/self-service-ui.yaml]
      values: |
        fullnameOverride: self-service-ui
        selfServiceUI:
          hostname: pfisterer.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site
          image: ghcr.io/dhbw-appstore-t3/k8s-self-service-ui
          imagePullPolicy: IfNotPresent
          # Only the AppStore section is wired up; DNS and projects tabs stay hidden.
          dynamicZonesBaseUrl: https://unused.invalid
          cloudResourcesBaseUrl: ""
          appstoreBaseUrl: /api/appstore
          appstoreUpstream: appstore-api:8000
        auth:
          oidc:
            issuerUrl: https://sso-pfisterer.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site/realms/appstore
            clientId: appstore
            authorizationUrl: https://sso-pfisterer.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site/realms/appstore/protocol/openid-connect/auth
            tokenUrl: https://sso-pfisterer.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site/realms/appstore/protocol/openid-connect/token
            jwksUrl: https://sso-pfisterer.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site/realms/appstore/protocol/openid-connect/certs
            endSessionUrl: https://sso-pfisterer.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site/realms/appstore/protocol/openid-connect/logout
        ingress: { enabled: false }       # the BFF owns the public host
        bff:
          enabled: true
          existingSecret: oauth2-proxy-ui-secret   # client-id, client-secret, cookie-secret
          whitelistDomains: [sso-pfisterer.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site]
  destination:
    server: https://kubernetes.default.svc
    namespace: appstore
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
