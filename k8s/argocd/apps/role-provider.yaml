apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: role-provider-service
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  project: default
  source:
    repoURL: ghcr.io/pfisterer/charts      # OCI registry (public)
    chart: role-provider-service
    targetRevision: 0.8.0
    helm:
      values: |
        fullnameOverride: role-provider-service
        roleProviderService:
          hostname: role-provider.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site
          # Persistent (CNPG database roleprovider). Groups and members are
          # filled by the role-provider-seed Job (k8s/manifests/seed).
          db: { type: postgres }
          existingSecret: role-provider-secret   # keys: db-connection-string, api-tokens, api-write-tokens
          groupRelations: [dozent, studierende]
        # Only appstore-api talks to it, in-cluster.
        ingress: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: appstore
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
