# Images of our AppStore (k8s/charts/appstore), written by the k8s-bump
# workflow after each push of a component's branch ("[skip ci]" commit):
# backend and worker from spike/dev, the frontend from spike/vue-pods (the Vue
# frontend; spike/dev of the frontend is the React port). The digest of the
# image built from that commit, with its tag as a comment. Argo CD rolls out
# what is here. Do not edit by hand, except to roll back.
# Until the first bump: the moving spike-dev / spike-vue-pods tags.
images:
  tags:
    backend: "sha256:18716f03b9a4cbb799d3933b7a7dbe84c04694794542808ea12444df38fd7c7c"  # sha-794e9db
    worker: spike-dev
    workerPods: spike-dev
    frontend: spike-vue-pods
