# Staging: tracks the branch `dev`; the component CIs roll their `dev` images out here.
env:
  name: staging
  namespace: appstore-staging
  branch: dev
  host: appstore-staging.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site
  ssoHost: sso-staging.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site
  # The second UI; ONE label below the zone (the wildcard certificate).
  selfServiceHost: self-service-staging.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site
# Read-only MCP server for agents (github.com/DHBW-AppStore-T3/appstore-mcp).
mcp:
  enabled: true
  host: appstore-mcp-staging.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site
  zone: t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site
platform:
  demoUsers: true
appstore:
  selfServiceUi:
    enabled: true
  # ClamAV: enabled on staging so uploads are scanned; fail-closed (503 when scanner is down).
  clamav:
    enabled: true
  # Demo course and catalog apps after every sync (charts/appstore/templates/seed-job.yaml).
  seed:
    enabled: true
  # The components' packages on ghcr.io are private: k8s/bootstrap.sh creates
  # this docker-registry Secret from a read:packages token.
  images:
    pullSecrets: [ghcr-pull]
  api:
    # Moodle's LTI keys: its public name -> the ingress controller's Service
    # (kubectl -n kube-system get svc traefik); see values.yaml api.hostAliases.
    hostAliases:
      - ip: "fd00:43::2fb9"
        hostnames: ["moodle-staging.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site"]
    # LTI 1.3 from Moodle (off while clientId is empty). Moodle's tool URLs:
    # https://<host>/api/lti13/login and https://<host>/api/lti13/launch.
    lti:
      # Moodle (moodle-staging): issuer = wwwroot; the tool is the mod_lti type
      # "DHBW AppStore" (client and deployment id are public identifiers).
      platformIssuer: "https://moodle-staging.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site"
      clientId: "igUs9thTxg8FE2S"
      deploymentId: "1"
      jwksUrl: "https://moodle-staging.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site/mod/lti/certs.php"
  # Apps that run as pods: https://<workload>-<deployment>.<appDomain>.
  podApps:
    zone: t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site
    # The cluster's wildcard certificate covers *.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site: stay one label below it.
    appDomain: t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site
    # The cluster's own ranges (pods fd00:42::/64 + 10.42.0.0/16, services
    # fd00:43::/108, the node's public IPv6 address) are unreachable from
    # student pods.
    extraEgressExcept:
      - 10.42.0.0/16
      - fd00:42::/48
      - fd00:43::/48
      - 2001:7c0:1b20:c913:1::10d/128
  network:
    # The Kubernetes API as pods reach it: the "kubernetes" Service and, after
    # DNAT, the API server on the node. Check with
    #   kubectl get svc,endpoints kubernetes -n default
    kubeApi:
      cidrs:
        - fd00:43::1/128
        - 10.43.0.1/32
        - 2001:7c0:1b20:c913:1::10d/128
moodle:
  enabled: true
  # Moodle (k8s/charts/moodle); one label below the wildcard certificate.
  host: moodle-staging.t3-k8s.s242437-at-student-dhbw-mannheim-de.users.dhbw.site
  images:
    pullSecrets: [ghcr-pull]
  site:
    adminEmail: max.rml@web.de
  # Demo users of Moodle (password: Secret moodle-demo); same e-mail addresses as
  # the Keycloak users, so an LTI launch and the SSO login meet the same AppStore user.
  setup:
    demoUsers:
      - { username: dozent.demo, email: dozent.demo@appstore.example, firstName: Dozentin, lastName: Demo, role: teacher }
      - { username: student1.demo, email: student1.demo@appstore.example, firstName: Studentin, lastName: Eins, role: student }
      - { username: student2.demo, email: student2.demo@appstore.example, firstName: Student, lastName: Zwei, role: student }
