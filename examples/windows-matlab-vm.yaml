apiVersion: appstore/v2
name: windows-matlab-vm
runtime: kubevirt-vm
scope: user
vm:
  cpuCores: 4
  memoryGiB: 8
  diskGiB: 80
  # Name of the PVC in namespace vm-poc that serves as the golden image.
  # Create it once via: kubectl create pvc windows11-matlab-golden -n vm-poc ...
  # then populate it from the Glance image using the install-cinder-csi.sh script.
  imageRef: windows11-matlab-golden
  storageClass: cinder
  vncAccess: true
access:
  - type: url
    # workload is the DNS-1123 name of the user's workload slot,
    # deployment is the 8-hex short deployment id.
    template: "https://{workload}-novnc-{deployment}.apps.{zone}/"
