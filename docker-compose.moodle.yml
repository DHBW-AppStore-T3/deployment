# ================================================================
# Moodle stack — deploys the org's actual moodle_appstore fork
# (github.com/DHBW-AppStore-T3/moodle_appstore, a fork of Moodle core
# with its own committed docker-compose.yml at repo root). Additive to
# docker-compose.prod.yml:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.moodle.yml up -d
#
# Corrected version of this file: an earlier revision built from a
# `../moodle/Dockerfile` that cloned Moodle core at build time and
# expected MOODLE_ADMIN/MOODLE_DB_* env vars to drive an unattended
# install — neither exists. moodle_appstore is the real source, it
# ships no Dockerfile (it uses the official moodlehq/moodle-php-apache
# image with the repo bind-mounted as document root, verified against
# its own docker-compose.yml), and moodlehq/moodle-php-apache has no
# env-var-driven auto-install — first boot needs one manual
# `admin/cli/install.php` run, same as any Moodle install (see
# docs/prod-setup.md's Moodle section for the exact command).
#
# Isolation: moodle-network is NOT bridged to backend-network,
# worker-network, or keycloak-network — this is a standalone LTI
# prototype with no runtime dependency on the AppStore backend/worker/
# DB or its identity provider. It IS bridged to frontend-network, but
# only so nginx (which lives there) can reach it as a reverse-proxy
# upstream — see nginx/nginx-moodle.conf.
#
# Public exposure: appstore-prod-01 has no DNS domain, only a
# self-signed cert on its bare IPv6 address (see nginx/certs/), so a
# moodle.<domain> subdomain isn't possible. Moodle is exposed on a
# second nginx listener, port 8443 on the same host/certificate,
# instead — see nginx/conf.d/moodle.conf.
#
# moodle_appstore's own docker-compose.yml hardcodes dev credentials
# (moodle/moodlepass) — replaced here with required .env variables so
# a stray `git blame` never turns up a production Moodle DB password.
# ================================================================
services:
  moodle-db:
    image: postgres:17-alpine
    container_name: moodle-db-prod
    environment:
      POSTGRES_DB: ${MOODLE_DB_NAME:-moodle}
      POSTGRES_USER: ${MOODLE_DB_USER:-moodle}
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?MOODLE_DB_PASSWORD is required}
    volumes:
      - moodle_db_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOODLE_DB_USER:-moodle}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moodle-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # moodle_appstore itself provides no image — its docker-compose.yml
  # bind-mounts the checked-out repo into moodlehq/moodle-php-apache.
  # This does the same against ${MOODLE_REPO_PATH}, the repo's own
  # checkout path on the host (sibling to deployment/, matching how
  # backend/frontend/worker are laid out), instead of a build step.
  moodle:
    image: moodlehq/moodle-php-apache:8.3
    container_name: moodle-prod
    depends_on:
      moodle-db:
        condition: service_healthy
    environment:
      MOODLE_DOCKER_DBTYPE: pgsql
      MOODLE_DOCKER_DBHOST: moodle-db
      MOODLE_DOCKER_DBNAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DOCKER_DBUSER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DOCKER_DBPASS: ${MOODLE_DB_PASSWORD:?MOODLE_DB_PASSWORD is required}
    volumes:
      - ${MOODLE_REPO_PATH:?MOODLE_REPO_PATH is required, e.g. /opt/app-store/moodle_appstore}:/var/www/html
      - moodle_data_prod:/var/www/moodledata
      # moodle_appstore ships its own apache.conf at .docker/apache.conf
      # (same repo checkout as the html mount above) — reused as-is
      # rather than duplicated into this repo, so an upstream change to
      # it doesn't silently drift out of sync here.
      - ${MOODLE_REPO_PATH:?MOODLE_REPO_PATH is required}/.docker/apache.conf:/etc/apache2/sites-enabled/000-default.conf:ro
    healthcheck:
      # / redirects to /login/index.php pre-install and serves the
      # dashboard post-install — either way a 2xx/3xx confirms Apache
      # and PHP are actually serving, which is all this needs to know.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - moodle-network
      - frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------
  # nginx override — adds the 8443 Moodle listener on top of
  # docker-compose.prod.yml's nginx service. Compose merges list
  # fields (ports, volumes) by replacing the whole list, not
  # appending — this re-states 80/443 so they aren't lost.
  #
  # ./nginx/conf.d is mounted as a DIRECTORY, not a single file: a
  # directory bind mount fully replaces the image's own
  # /etc/nginx/conf.d, which otherwise still ships nginx:1.27-alpine's
  # default.conf (a `listen 80 server_name localhost` block) — that
  # would silently start alongside nginx.conf's own `listen 80`
  # redirect server once nginx.conf's `include conf.d/*.conf` picks it
  # up. Mounting the directory keeps only what we put in
  # ./nginx/conf.d/ (currently just moodle.conf).
  # ----------------------------------------------------------------
  nginx:
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - keycloak
      - moodle
    networks:
      - frontend-network
      - backend-network
      - keycloak-network
      - moodle-network

volumes:
  moodle_db_prod_data:
    driver: local
  moodle_data_prod:
    driver: local

networks:
  moodle-network:
    driver: bridge
    name: moodle-network-prod
  frontend-network:
    external: true
    name: frontend-network-prod
  backend-network:
    external: true
    name: backend-network-prod
  keycloak-network:
    external: true
    name: keycloak-network-prod
