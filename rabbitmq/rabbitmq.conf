# Loaded from conf.d, so it layers on top of the image's defaults.
#
# consumer_timeout is how long RabbitMQ waits for an ack before it
# decides the consumer is stuck, closes the channel and REQUEUES the
# message. The default is 30 minutes.
#
# Celery is configured with task_acks_late=True (worker/app/celery_app.py),
# which means a deploy is acked only when it finishes. Any task that runs
# longer than the timeout therefore gets requeued and silently executed a
# second time - observed on 2026-09-20, where a 40-minute Windows image
# build restarted itself 13 seconds after failing, leaving an orphaned
# build instance behind each round.
#
# The ceiling has to clear the worst case a single deploy task can take.
# Per-subprocess limits today:
#
#   packer init      300s
#   packer build    3600s   (PER packer template - multi-image apps
#                            multiply this leg)
#   terraform init   300s
#   terraform plan   300s
#   terraform apply 1800s
#
# Single-image worst case is ~1h45m; a three-image app approaches 4h.
# Six hours leaves headroom without being effectively infinite - a
# genuinely wedged consumer should still eventually be reclaimed.
consumer_timeout = 21600000
