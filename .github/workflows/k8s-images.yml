name: K8s - build images (spike)

# Spike only. Builds the three images of the k3s cluster and hands the new tag
# to Argo CD through git (k8s/env/*.yaml).
#
#   spike/dev   -> builds, tags the images, STAGING picks the tag up.
#   spike/main  -> never builds. Production runs exactly the images that were
#                  built on spike/dev: k8s/promote.sh opens a PR that brings
#                  the k8s/ tree (incl. the tag files) over.
#
# It must NOT run for main or dev: production.yml / staging.yml keep deploying
# the compose stack exactly as before.
on:
  push:
    branches: ['spike/dev']
    paths:
      - 'k8s/src/**'
      - '.github/workflows/k8s-images.yml'

concurrency:
  group: k8s-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # commit the new tag back to the branch
  packages: write

env:
  REGISTRY: ghcr.io/dhbw-appstore-t3

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: k8s-appstore-api,     context: k8s/src/appstore-api,     file: k8s/src/appstore-api/backend/Dockerfile }
          - { image: k8s-appstore-worker,  context: k8s/src/appstore-api,     file: k8s/src/appstore-api/worker/Dockerfile }
          - { image: k8s-self-service-ui,  context: k8s/src/self-service-ui,  file: k8s/src/self-service-ui/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64        # the k3s node is x86_64
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:spike-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ github.ref_name }}' }
      - name: Point the cluster at the new images
        run: |
          set -euo pipefail
          TAG="spike-${{ github.sha }}"
          sed -i "s/^  version: .*/  version: $TAG/" k8s/env/appstore-api.yaml k8s/env/self-service-ui.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/env
          git diff --cached --quiet && exit 0
          # GITHUB_TOKEN pushes do not trigger workflows, so this cannot loop.
          git commit -m "chore(k8s): deploy images $TAG [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
