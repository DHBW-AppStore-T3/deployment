name: CD - Hermes VM Provisioning & Rollout

# deployment#49. workflow_dispatch only — unlike staging.yml/production.yml,
# this never runs on a plain push. Provisioning a new dedicated VM and
# rolling podman-mcp out to three existing production/staging/ci hosts is
# not something that should happen implicitly on every merge; the issue's
# own Design Spec calls this out as a human-triggered, one-time migration
# step. Runs on the self-hosted runner (same as staging/production) because
# that is the only thing with both tfstate-postgres access and network
# reach to appstore-prod-01/staging-dhbw-appstore, and it already *is*
# ci-dhbw-appstore for the "ci" rollout target.
#
# Run order: provision-hermes-vm, THEN set the HERMES_VM_IPV6 repo secret
# (used by envs/production and envs/staging's podman_mcp_from_hermes
# security-group rule — see their variables.tf) and re-verify/update
# agent/config.yaml's podman-* URLs against the real IP Terraform assigned,
# THEN the three rollout-podman-mcp-* jobs (any order), THEN
# start-hermes-agent, THEN cleanup-prod-old-overlay.
#
# Precondition the first job cannot satisfy itself: the HERMES_ENV_FILE
# repo secret (GEMINI_API_KEY, DISCORD_BOT_TOKEN, DISCORD_ALLOWED_USERS,
# GITHUB_TOKEN — same shape as PRODUCTION_ENV_FILE/STAGING_ENV_FILE) must
# already be set before provision-hermes-vm runs its Ansible step. GitHub
# secrets are write-only — this cannot be derived from PRODUCTION_ENV_FILE
# programmatically even though Hermes' credentials previously lived there;
# a human who holds the actual Discord bot token and Gemini key must set
# it by hand, once, carrying the existing bot identity over 1:1 rather
# than minting new credentials (see claude_docs/decisions/
# 2026-hermes-dedicated-vm.md).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which step to run"
        type: choice
        options:
          - provision-hermes-vm
          - rollout-podman-mcp-prod
          - rollout-podman-mcp-staging
          - rollout-podman-mcp-ci
          - start-hermes-agent
          - cleanup-prod-old-overlay
        required: true

jobs:
  provision-hermes-vm:
    if: inputs.target == 'provision-hermes-vm'
    name: Provision hermes-dhbw-appstore (Terraform + Ansible)
    runs-on: self-hosted
    permissions:
      contents: read
    # Same OpenStack tenant as production/staging (one project,
    # ma_wwi_24sea_appstore_g3) — reuses PROD_OS_* rather than minting a
    # near-duplicate HERMES_OS_* secret family for an identical credential.
    env:
      OS_AUTH_URL: ${{ secrets.PROD_OS_AUTH_URL }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_SECRET }}
      OS_REGION_NAME: ${{ secrets.PROD_OS_REGION_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key
          ssh-keygen -y -P '' -f ~/.ssh/openstack-key > ~/.ssh/openstack-key.pub
          echo "TF_VAR_ssh_public_key=$(cat ~/.ssh/openstack-key.pub)" >> "$GITHUB_ENV"

      - name: Terraform Init, Validate, Plan & Apply
        working-directory: infrastructure/terraform/envs/hermes
        run: |
          terraform init
          terraform validate
          terraform plan -out=tfplan
          terraform apply tfplan
          echo "VM_IP=$(terraform output -raw vm_ip)" >> "$GITHUB_ENV"

      - name: Report VM IP
        run: |
          echo "hermes-dhbw-appstore provisioned at: $VM_IP"
          echo "::notice::Set this as the HERMES_VM_IPV6 repo secret before the next staging/production deploy (needed by envs/production and envs/staging's podman_mcp_from_hermes security-group rule), and verify agent/config.yaml's podman-* URLs match this IP — update them if it differs from the placeholders committed there."

      - name: Install Ansible and Dependencies
        run: |
          sudo apt-get install -y rsync python3-pip
          pip3 install --user --break-system-packages "ansible>=8.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ansible-galaxy role install -r infrastructure/ansible/requirements.yml -p infrastructure/ansible/roles_external
          ansible-galaxy collection install -r infrastructure/ansible/requirements.yml

      - name: Generate Ansible Inventory
        working-directory: infrastructure/ansible
        run: |
          cat > inventory.ini <<EOF
          [docker_vm]
          ${VM_IP} ansible_user=ubuntu
          EOF

      - name: Run Ansible Playbook
        working-directory: infrastructure/ansible
        run: |
          ansible-playbook -i inventory.ini \
            --private-key ~/.ssh/openstack-key \
            hermes.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          ANSIBLE_FORCE_COLOR: 'True'
          HERMES_ENV_FILE: ${{ secrets.HERMES_ENV_FILE }}

      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f ~/.ssh/openstack-key ~/.ssh/openstack-key.pub
          rm -f infrastructure/ansible/inventory.ini

  rollout-podman-mcp-prod:
    if: inputs.target == 'rollout-podman-mcp-prod'
    name: Roll out podman-mcp on appstore-prod-01
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      OS_AUTH_URL: ${{ secrets.PROD_OS_AUTH_URL }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_SECRET }}
      OS_REGION_NAME: ${{ secrets.PROD_OS_REGION_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Reads the existing envs/production state rather than a hardcoded
      # IP — same source of truth production.yml itself uses, so this
      # never drifts from the VM Terraform actually manages.
      - name: Resolve appstore-prod-01's current IP from Terraform state
        working-directory: infrastructure/terraform/envs/production
        run: |
          terraform init
          echo "PROD_HOST=$(terraform output -raw vm_ip)" >> "$GITHUB_ENV"

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key

      - name: Sync podman-mcp overlay + agent/ to appstore-prod-01
        # /home/ubuntu/app, not /opt/app-store/deployment: that path is
        # docs/prod-setup.md's manual-bootstrap walkthrough location, but
        # this VM was actually provisioned by production.yml's Ansible
        # playbook (infrastructure/ansible/production.yml), whose
        # project_root is /home/ubuntu/app — same as staging. Verified
        # against the real failure: the manual-doc path doesn't exist on
        # this host at all ("mkdir failed: No such file or directory").
        # --rsync-path="sudo rsync": the tree is root-owned from Ansible's
        # own become:yes synchronize task, same reasoning as staging below.
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no" \
            --rsync-path="sudo rsync" \
            --include="docker-compose.podman-mcp.yml" \
            --include="agent/***" \
            --exclude="*" \
            ./ "ubuntu@[${PROD_HOST}]:/home/ubuntu/app/"

      - name: Start podman-mcp on appstore-prod-01
        # sudo MCP_ENV=prod, not MCP_ENV=prod sudo: sudo resets the
        # environment for the command it runs unless -E/env_keep is
        # configured, so a leading VAR=val before sudo never reaches the
        # child process — confirmed by the real failure ("MCP_ENV is
        # missing a value"). sudo itself accepts a leading VAR=val as
        # part of the command line, which does reach the child.
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${PROD_HOST}" \
            "cd /home/ubuntu/app && sudo MCP_ENV=prod docker compose -f docker-compose.prod.yml -f docker-compose.podman-mcp.yml up -d --build podman-mcp"

      - name: Verify healthy
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${PROD_HOST}" \
            "sudo docker ps --filter name=podman-mcp-prod --format '{{.Names}}\t{{.Status}}'"

      - name: Cleanup Sensitive Files
        if: always()
        run: rm -f ~/.ssh/openstack-key

  rollout-podman-mcp-staging:
    if: inputs.target == 'rollout-podman-mcp-staging'
    name: Roll out podman-mcp on staging-dhbw-appstore
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      OS_AUTH_URL: ${{ secrets.STAGING_OS_AUTH_URL }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.STAGING_OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.STAGING_OS_APPLICATION_CREDENTIAL_SECRET }}
      OS_REGION_NAME: ${{ secrets.STAGING_OS_REGION_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Resolve staging-dhbw-appstore's current IP from Terraform state
        working-directory: infrastructure/terraform/envs/staging
        run: |
          terraform init
          echo "STAGING_HOST=$(terraform output -raw vm_ip)" >> "$GITHUB_ENV"

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key

      - name: Sync podman-mcp overlay + agent/ to staging-dhbw-appstore
        # --rsync-path="sudo rsync": staging.yml's Ansible playbook runs
        # with become:yes (root) throughout, including its own
        # synchronize task, so /home/ubuntu/app is root-owned — a plain
        # ubuntu-user rsync fails with "Permission denied" on write
        # (verified against a real run). docker compose below needs the
        # same elevation for the same reason.
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no" \
            --rsync-path="sudo rsync" \
            --include="docker-compose.podman-mcp.yml" \
            --include="agent/***" \
            --exclude="*" \
            ./ "ubuntu@[${STAGING_HOST}]:/home/ubuntu/app/"

      - name: Start podman-mcp on staging-dhbw-appstore
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${STAGING_HOST}" \
            "cd /home/ubuntu/app && sudo MCP_ENV=staging docker compose -f docker-compose.staging.yml -f docker-compose.podman-mcp.yml up -d --build podman-mcp"

      - name: Verify healthy
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${STAGING_HOST}" \
            "sudo docker ps --filter name=podman-mcp-staging --format '{{.Names}}\t{{.Status}}'"

      - name: Cleanup Sensitive Files
        if: always()
        run: rm -f ~/.ssh/openstack-key

  rollout-podman-mcp-ci:
    if: inputs.target == 'rollout-podman-mcp-ci'
    name: Roll out podman-mcp on ci-dhbw-appstore (local — this runner IS ci-dhbw-appstore)
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key

      - name: Sync podman-mcp overlay + agent/ to ci-dhbw-appstore
        # Real bug found running this job for real: it assumed the runner
        # container itself could run docker compose — wrong, that
        # container deliberately has no Docker socket mount (see
        # infrastructure/runner-vm/docker-compose.yml's header comment),
        # confirmed by "no such file or directory" on /var/run/docker.sock.
        # Fixed the same way as prod/staging: SSH into the actual VM.
        # network_mode: host means this container shares the VM's network
        # namespace, so 127.0.0.1 reaches its own sshd — confirmed with a
        # read-only whoami probe before this real change, since
        # ci-dhbw-appstore is hand-built (no Terraform env) and its
        # authorized key wasn't otherwise documented anywhere.
        # /home/ubuntu/app: same convention as prod/staging, and this
        # host has no prior podman-mcp deploy to contradict it — rsync
        # creates the destination directory if it doesn't exist yet.
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no -o BatchMode=yes" \
            --rsync-path="sudo rsync" \
            --include="docker-compose.podman-mcp.yml" \
            --include="agent/***" \
            --exclude="*" \
            ./ "ubuntu@127.0.0.1:/home/ubuntu/app/"

      - name: Start podman-mcp on ci-dhbw-appstore
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no -o BatchMode=yes ubuntu@127.0.0.1 \
            "cd /home/ubuntu/app && sudo MCP_ENV=ci docker compose -f docker-compose.podman-mcp.yml up -d --build podman-mcp"

      - name: Verify healthy
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no -o BatchMode=yes ubuntu@127.0.0.1 \
            "sudo docker ps --filter name=podman-mcp-ci --format '{{.Names}}\t{{.Status}}'"

      - name: Cleanup Sensitive Files
        if: always()
        run: rm -f ~/.ssh/openstack-key

  start-hermes-agent:
    if: inputs.target == 'start-hermes-agent'
    name: Start hermes-agent on hermes-dhbw-appstore
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      OS_AUTH_URL: ${{ secrets.PROD_OS_AUTH_URL }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_SECRET }}
      OS_REGION_NAME: ${{ secrets.PROD_OS_REGION_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Same one already applied by the provision-hermes-vm job — the
      # 'provision-hermes-vm' run must have completed first, same as this
      # workflow's Ansible playbook already required.
      - name: Resolve hermes-dhbw-appstore's current IP from Terraform state
        working-directory: infrastructure/terraform/envs/hermes
        run: |
          terraform init
          echo "HERMES_HOST=$(terraform output -raw vm_ip)" >> "$GITHUB_ENV"

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key

      - name: TEMP FIX - free disk space (root disk full, image pulls failing)
        # Real failure hit in this deployment: "no space left on device"
        # extracting nousresearch/hermes-agent's image layers. This VM was
        # provisioned with docker_data_volume_size_gb = 0 (envs/hermes/
        # main.tf) on the assumption that a single lightweight agent
        # container needed no dedicated data volume — wrong: the image
        # itself is large (200MB+ layers, includes a bundled Playwright/
        # Chromium install), and pull_policy: always re-pulls it on every
        # dispatch, accumulating old layers on the small root disk.
        # docker system prune is the immediate unblock; a real Cinder data
        # volume (matching staging/production's docker_data_volume_size_gb
        # = 50 pattern) is the durable fix, not done here — would need a
        # volume attach + filesystem grow against a VM that already holds
        # state, riskier than clearing stale layers first.
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${HERMES_HOST}" \
            "df -h / && sudo docker image prune -af && sudo docker builder prune -af && df -h /"

      - name: TEMP FIX - append GROQ_API_KEY to the live .env on hermes-dhbw-appstore
        # HERMES_ENV_FILE (the secret) doesn't have GROQ_API_KEY yet — it
        # can't be safely rewritten from here (write-only, full content
        # unknown). Appends directly to the live .env so the compose file's
        # new required var is satisfied immediately; HERMES_ENV_FILE itself
        # still needs this line added by whoever holds it, or the next
        # provision-hermes-vm run overwrites this file from the old secret.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${HERMES_HOST}" \
            "grep -q '^GROQ_API_KEY=' /home/ubuntu/app/.env && sudo sed -i \"s|^GROQ_API_KEY=.*|GROQ_API_KEY=${GROQ_API_KEY}|\" /home/ubuntu/app/.env || echo 'GROQ_API_KEY=${GROQ_API_KEY}' | sudo tee -a /home/ubuntu/app/.env > /dev/null"

      - name: TEMP - fetch live .env as a downloadable artifact (fixes HERMES_ENV_FILE)
        # Two attempts to pipe `ssh ... | gh secret set HERMES_ENV_FILE` from
        # a local machine both failed at the SSH step (wrong key — the
        # deploy keypair only exists as the SSH_PRIVATE_KEY repo secret,
        # never on any operator's own machine) — but gh secret set still
        # reported success both times, silently setting the secret to empty
        # content from the failed pipe's empty stdin. GitHub Actions logs
        # are not an acceptable place to print this file (persisted,
        # visible to anyone with repo read access), so this uploads it as a
        # build artifact instead — downloadable, not rendered in the log
        # viewer, auto-expires. Download with `gh run download <run-id> -n
        # hermes-env -D /tmp/hermes-env-fix`, then `gh secret set
        # HERMES_ENV_FILE -R DHBW-AppStore-T3/deployment < /tmp/hermes-env-fix/.env`,
        # then delete the local copy.
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${HERMES_HOST}" \
            "sudo cat /home/ubuntu/app/.env" > /tmp/hermes.env

      - name: Upload .env artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-env
          path: /tmp/hermes.env
          retention-days: 1

      - name: Start hermes-agent
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${HERMES_HOST}" \
            "cd /home/ubuntu/app && docker compose -f docker-compose.hermes.yml up -d --pull always"

      - name: Verify
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${HERMES_HOST}" \
            "docker ps --filter name=hermes-agent --format '{{.Names}}\t{{.Status}}'"

      - name: hermes-agent container logs (last 100 lines)
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${HERMES_HOST}" \
            "docker logs hermes-agent --tail 100"

      - name: Cleanup Sensitive Files
        if: always()
        run: rm -f ~/.ssh/openstack-key

  cleanup-prod-old-overlay:
    if: inputs.target == 'cleanup-prod-old-overlay'
    name: Remove old docker-compose.agent.yml copy from appstore-prod-01
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      OS_AUTH_URL: ${{ secrets.PROD_OS_AUTH_URL }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_SECRET }}
      OS_REGION_NAME: ${{ secrets.PROD_OS_REGION_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Resolve appstore-prod-01's current IP from Terraform state
        working-directory: infrastructure/terraform/envs/production
        run: |
          terraform init
          echo "PROD_HOST=$(terraform output -raw vm_ip)" >> "$GITHUB_ENV"

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key

      - name: Remove the stale compose file (Hermes no longer runs here)
        # /home/ubuntu/app, not /opt/app-store/deployment — see the
        # rollout-podman-mcp-prod job's comment for why.
        run: |
          ssh -i ~/.ssh/openstack-key -o StrictHostKeyChecking=no "ubuntu@${PROD_HOST}" \
            "test -f /home/ubuntu/app/docker-compose.agent.yml && sudo rm -v /home/ubuntu/app/docker-compose.agent.yml || echo 'already absent'"

      - name: Cleanup Sensitive Files
        if: always()
        run: rm -f ~/.ssh/openstack-key
