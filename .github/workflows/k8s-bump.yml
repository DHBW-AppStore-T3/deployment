name: K8s - roll out an image

# Called by the CI of backend, worker, frontend, appstore-mcp and moodle (moodle_appstore) after they pushed an image
# from `dev` (staging) or `main` (prod):
#   gh workflow run k8s-bump.yml --ref <dev|main> \
#     -f component=... -f tag=sha-<commit> -f digest=sha256:<64 hex>
# Writes the digest into k8s/images/<staging|prod>.yaml of that branch; Argo CD
# of that environment follows. The caller passes the digest it pushed, so this
# workflow needs no read access to the components' (private) packages.
#   dev   a commit on dev                       -> staging
#   main  a pull request with auto-merge on main -> prod (main requires the
#         Gitleaks check, which this workflow dispatches on the bump branch)
on:
  workflow_dispatch:
    inputs:
      component:
        description: "backend | worker | worker-pods | frontend | appstore-mcp | self-service-ui | moodle"
        required: true
        type: choice
        options: [backend, worker, worker-pods, frontend, appstore-mcp, self-service-ui, moodle]
      tag:
        description: "Image tag pushed by the component's CI (sha-<7 hex>)"
        required: true
        type: string
      digest:
        description: "Digest of that image (sha256:<64 hex>)"
        required: true
        type: string

concurrency:
  group: k8s-bump-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write     # dispatch the secret scan on the bump branch

jobs:
  bump:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "tag must be sha-<hex>, got '$TAG'" >&2; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest must be sha256:<64 hex>, got '$DIGEST'" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Pin the image by its digest
        id: pin
        env:
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            backend) KEY=backend ;; worker) KEY=worker ;; worker-pods) KEY=workerPods ;; frontend) KEY=frontend ;; appstore-mcp) KEY=appstoreMcp ;; self-service-ui) KEY=selfServiceUi ;; moodle) KEY=moodle ;;
          esac
          if [ "$BRANCH" = main ]; then ENV=prod; else ENV=staging; fi
          FILE="k8s/images/${ENV}.yaml"
          sed -i -E "s|^(    ${KEY}:).*|\1 \"${DIGEST}\"  # ${TAG}|" "$FILE"
          grep -q "${DIGEST}" "$FILE" || { echo "${FILE} has no key ${KEY}" >&2; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --cached --quiet && { echo "already at ${DIGEST}"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "env=${ENV}" >> "$GITHUB_OUTPUT"
          git commit -m "chore(k8s): roll out ${COMPONENT} ${TAG} on ${ENV} [skip ci]"
      - name: Staging - push to dev
        if: steps.pin.outputs.changed == 'true' && github.ref_name == 'dev'
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin dev && git push origin HEAD:dev && exit 0
            sleep 5
          done
          exit 1
      - name: Prod - pull request into main, merged when the checks pass
        if: steps.pin.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ inputs.tag }}
        run: |
          BR="bump/prod-${COMPONENT}-${TAG}"
          git push origin "HEAD:refs/heads/${BR}"
          # No workflow runs for a pull request opened with the GITHUB_TOKEN:
          # report the required check by running it on the branch ourselves.
          gh workflow run secret-scan.yml --ref "$BR"
          gh pr create --base main --head "$BR" \
            --title "chore(k8s): roll out ${COMPONENT} ${TAG} on prod" \
            --body "Written by k8s-bump.yml after the CI of ${COMPONENT} pushed ${TAG} from main. Merges itself when the Gitleaks check is green."
          gh pr merge "$BR" --auto --squash --delete-branch
