name: K8s - roll out an image (staging)

# Called by the CI of backend and worker (spike/dev) and of the frontend
# (spike/react-pods) after they pushed an image:
#   gh workflow run k8s-bump.yml --ref spike/dev #     -f component=... -f tag=sha-<commit> -f digest=sha256:<64 hex>
# Writes the digest into k8s/env/appstore.yaml on spike/dev; Argo CD's staging
# follows. The caller passes the digest it pushed, so this workflow needs no
# read access to the components' (private) packages. Production gets it only
# through k8s/promote.sh (a PR into spike/main).
on:
  workflow_dispatch:
    inputs:
      component:
        description: "backend | worker | worker-pods | frontend"
        required: true
        type: choice
        options: [backend, worker, worker-pods, frontend]
      tag:
        description: "Image tag pushed by the component's CI (sha-<7 hex>)"
        required: true
        type: string
      digest:
        description: "Digest of that image (sha256:<64 hex>)"
        required: true
        type: string
  # Only so that GitHub knows this workflow: it is not on the default branch,
  # and a dispatch-only workflow that never ran cannot be dispatched. The job
  # does not run for this event.
  push:
    branches: [spike/dev]
    paths: ['.github/workflows/k8s-bump.yml']

concurrency:
  group: k8s-bump
  cancel-in-progress: false

permissions:
  contents: write   # the commit to k8s/env/appstore.yaml

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/spike/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "tag must be sha-<hex>, got '$TAG'" >&2; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest must be sha256:<64 hex>, got '$DIGEST'" >&2; exit 1; }
      - uses: actions/checkout@v4
        with: { ref: spike/dev }
      - name: Pin the image by its digest
        env:
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            backend) KEY=backend ;; worker) KEY=worker ;; worker-pods) KEY=workerPods ;; frontend) KEY=frontend ;;
          esac
          sed -i -E "s|^(    ${KEY}:).*|\1 \"${DIGEST}\"  # ${TAG}|" k8s/env/appstore.yaml
          grep -q "${DIGEST}" k8s/env/appstore.yaml || { echo "k8s/env/appstore.yaml has no key ${KEY}" >&2; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/env/appstore.yaml
          git diff --cached --quiet && { echo "already at ${DIGEST}"; exit 0; }
          # GITHUB_TOKEN pushes do not trigger workflows, so this cannot loop.
          git commit -m "chore(k8s): roll out ${COMPONENT} ${TAG} on staging [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin spike/dev && git push origin HEAD:spike/dev && exit 0
            sleep 5
          done
          exit 1
