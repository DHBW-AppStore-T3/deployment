name: K8s - roll out an image (staging)

# Called by the CI of backend, worker and frontend after they pushed the
# images of a spike/dev commit (gh workflow run k8s-bump.yml --ref spike/dev
# -f component=... -f tag=sha-<commit>). Writes the image's digest into
# k8s/env/appstore.yaml on spike/dev; Argo CD's staging follows. Production
# gets it only through k8s/promote.sh (a PR into spike/main).
on:
  workflow_dispatch:
    inputs:
      component:
        description: "backend | worker | worker-pods | frontend"
        required: true
        type: choice
        options: [backend, worker, worker-pods, frontend]
      tag:
        description: "Image tag pushed by the component's CI (sha-<7 hex>)"
        required: true
        type: string

concurrency:
  group: k8s-bump
  cancel-in-progress: false

permissions:
  contents: write   # the commit to k8s/env/appstore.yaml
  packages: read    # reading the digest of a private package

jobs:
  bump:
    if: github.ref == 'refs/heads/spike/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "tag must be sha-<hex>, got '$TAG'" >&2; exit 1; }
      - uses: actions/checkout@v4
        with: { ref: spike/dev }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin the image by its digest
        env:
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/dhbw-appstore-t3/${COMPONENT}:${TAG}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for $IMAGE" >&2; exit 1; }
          case "$COMPONENT" in
            backend) KEY=backend ;; worker) KEY=worker ;; worker-pods) KEY=workerPods ;; frontend) KEY=frontend ;;
          esac
          sed -i -E "s|^(    ${KEY}:).*|\1 \"${DIGEST}\"  # ${TAG}|" k8s/env/appstore.yaml
          grep -q "${DIGEST}" k8s/env/appstore.yaml || { echo "k8s/env/appstore.yaml has no key ${KEY}" >&2; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/env/appstore.yaml
          git diff --cached --quiet && { echo "already at ${DIGEST}"; exit 0; }
          # GITHUB_TOKEN pushes do not trigger workflows, so this cannot loop.
          git commit -m "chore(k8s): roll out ${COMPONENT} ${TAG} on staging [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin spike/dev && git push origin HEAD:spike/dev && exit 0
            sleep 5
          done
          exit 1
