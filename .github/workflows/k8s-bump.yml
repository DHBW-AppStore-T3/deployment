name: K8s - roll out an image

# Called by the CI of backend, worker (image worker-pods), frontend, appstore-mcp, moodle (moodle_appstore)
# and this repository (novnc-proxy, .github/workflows/novnc-proxy.yml) after they pushed an image
# from `dev` (staging) or `main` (prod):
#   gh workflow run k8s-bump.yml --ref <dev|main> \
#     -f component=... -f tag=sha-<commit> -f digest=sha256:<64 hex>
# Writes the digest into k8s/images/<staging|prod>.yaml of that branch; Argo CD
# of that environment follows. Only a digest that the component's CI built from
# this branch, at the commit of the tag, is pinned: the CI signs that origin
# (artifact attestation), .github/scripts/verify-image.sh checks it. A stolen
# token that may start this workflow can therefore only roll out what our CI
# built anyway. The bump commit then gets the required check
# "🔏 Image provenance" from here (image-provenance.yml checks people's PRs).
#   dev   a pull request on dev, merged at once -> staging (dev takes changes only
#         through pull requests: ruleset "dev: only through pull requests"). The
#         commit is scanned for secrets first (a finding stops the roll-out) and the
#         merge commit gets the checks "🔒 Gitleaks" and "🔏 Image provenance" from here.
#   main  a pull request on main                -> prod, merged by a person who
#         checked it (main requires the Gitleaks check, which this workflow
#         dispatches on the bump branch). With the repository variable
#         PROD_AUTO_MERGE=true the pull request merges itself when the check
#         is green, as it did before (review S1: then anyone who can push to a
#         component's main rolls out to prod unseen).
on:
  workflow_dispatch:
    inputs:
      component:
        description: "backend | worker-pods | frontend | appstore-mcp | self-service-ui | moodle | novnc-proxy"
        required: true
        type: choice
        options: [backend, worker-pods, frontend, appstore-mcp, self-service-ui, moodle, novnc-proxy]
      tag:
        description: "Image tag pushed by the component's CI (sha-<7 hex>)"
        required: true
        type: string
      digest:
        description: "Digest of that image (sha256:<64 hex>)"
        required: true
        type: string

# One queue per branch and component. GitHub keeps one running and one waiting run per group and cancels
# an older waiting run when a newer one arrives: with one group per branch, bumps of different components
# that arrived together replaced each other (2026-10-26: frontend's rollout was lost). Per component, only
# an older bump of the same component can be replaced, and the newer one supersedes it anyway. Bumps of
# different components run side by side: each changes its own line, the staging step merges with rebase
# and retry, the prod step opens one pull request each.
concurrency:
  group: k8s-bump-${{ github.ref_name }}-${{ inputs.component }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write     # dispatch the secret scan on the bump branch
  packages: read     # resolve the image on ghcr.io (verify-image.sh)
  checks: write      # report "🔏 Image provenance" on the bump commit

jobs:
  bump:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "tag must be sha-<hex>, got '$TAG'" >&2; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest must be sha256:<64 hex>, got '$DIGEST'" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Check that the component's CI built this image from this branch
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          bash .github/scripts/verify-image.sh "$COMPONENT" "$TAG" "$DIGEST" "$GITHUB_REF_NAME"
      - name: Pin the image by its digest
        id: pin
        env:
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            backend) KEY=backend ;; worker-pods) KEY=workerPods ;; frontend) KEY=frontend ;; appstore-mcp) KEY=appstoreMcp ;; self-service-ui) KEY=selfServiceUi ;; moodle) KEY=moodle ;; novnc-proxy) KEY=novncProxy ;;
          esac
          if [ "$BRANCH" = main ]; then ENV=prod; else ENV=staging; fi
          FILE="k8s/images/${ENV}.yaml"
          sed -i -E "s|^(    ${KEY}:).*|\1 \"${DIGEST}\"  # ${TAG}|" "$FILE"
          grep -q "${DIGEST}" "$FILE" || { echo "${FILE} has no key ${KEY}" >&2; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --cached --quiet && { echo "already at ${DIGEST}"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "env=${ENV}" >> "$GITHUB_OUTPUT"
          # Staging commits go straight to dev and skip CI. A prod commit is the head of
          # a pull request, so it must NOT carry [skip ci]: that suppresses the
          # pull_request workflows and left the PR BLOCKED on the required check.
          SKIP=""; [ "$ENV" = staging ] && SKIP=" [skip ci]"
          git commit -m "chore(k8s): roll out ${COMPONENT} ${TAG} on ${ENV}${SKIP}"
      - name: Staging - pull request into dev, merged at once
        if: steps.pin.outputs.changed == 'true' && github.ref_name == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # dev accepts changes only through pull requests (no direct push, not even
          # for this workflow); dev needs no approval, so the bump merges itself.
          BR="bump/staging-${COMPONENT}-${TAG}-${RUN_ID}"
          SUBJECT="chore(k8s): roll out ${COMPONENT} ${TAG} on staging [skip ci]"
          # No workflow starts for a pull request opened with the GITHUB_TOKEN, so the required
          # checks are reported from here as check-runs. Retried; a post that still fails fails the run.
          post_check() {  # name, title, summary, commit
            for _ in 1 2 3; do
              gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name="$1" -f head_sha="$4" \
                -f status=completed -f conclusion=success -f "output[title]=$2" -f "output[summary]=$3" >/dev/null && return 0
              sleep 3
            done
            return 1
          }
          # "🔏 Image provenance" for the bump commit, verified in the step above. And the pull request
          # checklist (pr-checklist.yml, "PR Checklist / Checkliste"): this pull request is written by
          # the workflow and has no checklist for a person to tick, so it is reported as done, as the
          # check itself skips Dependabot's pull requests. Without it a bump would wait for ever once
          # the check is required on dev.
          report() {
            post_check "🔏 Image provenance" "${COMPONENT} ${TAG}: built by its CI from dev" \
              "Verified by k8s-bump.yml before pinning: ${RUN_URL}" "$(git rev-parse HEAD)" &&
            post_check "PR Checklist / Checkliste" "${COMPONENT} ${TAG}: automatic bump, no checklist" \
              "Written by k8s-bump.yml, not by a person: ${RUN_URL}" "$(git rev-parse HEAD)"
          }
          # The secret scan. Nothing starts a workflow for a bump commit or for the squash commit on
          # dev ([skip ci], and the GITHUB_TOKEN), so dev's head would have neither "🔒 Gitleaks" nor
          # "🔏 Image provenance", and a promotion pull request dev -> main (head: dev) would wait for
          # them for good: both are required on main (provenance once image_check.py applied it there)
          # and have to exist on the head commit. So the commit is scanned here, before anything is
          # pushed (a finding fails the run: nothing is rolled out), and both checks are reported on the
          # squash commit below. Only this commit is scanned: what came before was scanned when it
          # entered dev. The same gitleaks as secret-scan.yml.
          bash .github/scripts/install-gitleaks.sh
          gitleaks detect --source . --log-opts="-1" --redact --exit-code 1
          # The squash commit is a new commit. The checks are posted for it here and now, from a run
          # that is on a different commit (the one dev had when this run started): a check posted
          # for the very commit a dispatched run is on lands in that run's suite, and a pull request
          # does not list the checks of that suite (tested 2026-10-27), so it would stay pending.
          # The roll-out itself is done by then, so a failure here only makes the run red (somebody
          # sees that dev's head lacks the checks) and does not undo anything.
          MISSING_HINT="Until another commit lands on dev, a promotion pull request to main stays blocked on them: merge main into dev through a pull request."
          report_merge_commit() {
            local sha="" failed=0
            for _ in 1 2 3 4 5; do
              sha=$(gh pr view "$PRN" --json mergeCommit --jq '.mergeCommit.oid // empty') && [ -n "$sha" ] && break
              sleep 2
            done
            if [ -z "$sha" ] || [ "$sha" = "$GITHUB_SHA" ]; then
              echo "::error::no separate merge commit found: the checks are missing on dev's head. $MISSING_HINT"
              return 1
            fi
            post_check "🔒 Gitleaks" "${COMPONENT} ${TAG}: no secret in the commit" \
              "$(gitleaks version) found nothing in the bump commit: ${RUN_URL}" "$sha" || failed=1
            post_check "🔏 Image provenance" "${COMPONENT} ${TAG}: built by its CI from dev" \
              "Verified by k8s-bump.yml before pinning: ${RUN_URL}" "$sha" || failed=1
            if [ "$failed" = 1 ]; then
              echo "::error::could not report the checks on ${sha}. $MISSING_HINT"
              return 1
            fi
          }
          git push origin "HEAD:refs/heads/${BR}"
          report
          PRN=$(gh pr create --base dev --head "$BR" --title "$SUBJECT" \
            --body "Written by k8s-bump.yml after the CI of ${COMPONENT} pushed ${TAG} from dev; merges itself." | grep -o '[0-9]*$')
          for _ in 1 2 3; do
            if gh pr merge "$PRN" --squash --delete-branch --subject "$SUBJECT"; then
              if report_merge_commit; then exit 0; fi
              exit 1
            fi
            # dev moved on (another bump): put the commit on top again and retry.
            sleep 5
            git fetch origin dev && git rebase origin/dev && git push --force origin "HEAD:refs/heads/${BR}"
            report
          done
          exit 1
      - name: Prod - pull request into main
        if: steps.pin.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
          AUTO_MERGE: ${{ vars.PROD_AUTO_MERGE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BR="bump/prod-${COMPONENT}-${TAG}"
          git push origin "HEAD:refs/heads/${BR}"
          # No workflow runs for a pull request opened with the GITHUB_TOKEN:
          # report the required checks ourselves. The secret scan runs on the
          # branch; the image's origin was verified in the step above.
          gh workflow run secret-scan.yml --ref "$BR"
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name="🔏 Image provenance" \
            -f head_sha="$(git rev-parse HEAD)" -f status=completed -f conclusion=success \
            -f "output[title]=${COMPONENT} ${TAG}: built by its CI from main" \
            -f "output[summary]=Verified by k8s-bump.yml before pinning: ${RUN_URL}" >/dev/null
          # The pull request checklist (pr-checklist.yml) has nothing to check on a pull request this
          # workflow writes; the review that main requires stays.
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name="PR Checklist / Checkliste" \
            -f head_sha="$(git rev-parse HEAD)" -f status=completed -f conclusion=success \
            -f "output[title]=${COMPONENT} ${TAG}: automatic bump, no checklist" \
            -f "output[summary]=Written by k8s-bump.yml, not by a person: ${RUN_URL}" >/dev/null
          case "$COMPONENT" in worker-pods) REPO=worker ;; novnc-proxy) REPO=deployment ;; moodle) REPO=moodle_appstore ;; *) REPO="$COMPONENT" ;; esac
          SOURCE="https://github.com/DHBW-AppStore-T3/${REPO}/commit/${TAG#sha-}"
          if [ "$AUTO_MERGE" = true ]; then
            NOTE="Merges itself when the Gitleaks check is green (PROD_AUTO_MERGE)."
          else
            NOTE="Merging rolls it out to prod. The image was built by the CI of ${COMPONENT} from main at this commit (check \"🔏 Image provenance\"); check that the commit is the one meant for prod, then approve and merge."
          fi
          printf '%s\n\n- component: %s\n- commit: %s\n- digest: %s\n- requested by: %s (%s)\n\n%s\n' \
            "Written by k8s-bump.yml after the CI of ${COMPONENT} pushed ${TAG} from main." \
            "$COMPONENT" "$SOURCE" "$DIGEST" "$GITHUB_TRIGGERING_ACTOR" "$RUN_URL" "$NOTE" > /tmp/body.md
          gh pr create --base main --head "$BR" \
            --title "chore(k8s): roll out ${COMPONENT} ${TAG} on prod" --body-file /tmp/body.md
          if [ "$AUTO_MERGE" = true ]; then
            gh pr merge "$BR" --auto --squash --delete-branch
          fi
