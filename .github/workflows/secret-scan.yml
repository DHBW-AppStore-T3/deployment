name: Secret Scan

# Pre-merge gate for accidentally committed secrets (tokens, SSH keys,
# OpenStack application credentials). Runs on every PR and on push to
# main. Uses the gitleaks CLI directly — the upstream gitleaks-action
# requires a paid license for organization repos, the binary is MIT.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  # Dispatched by k8s-bump.yml on its bump/* branch: a pull request opened with
  # the GITHUB_TOKEN triggers no workflow, and the required check must still be
  # reported on that commit.
  workflow_dispatch:

jobs:
  gitleaks:
    name: "🔒 Gitleaks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history so gitleaks can scan all commits introduced
          # by the PR (or all of main on push).
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Two-pass pattern: blocking gate first, then SARIF emit so all
      # findings (incl. ignored ones in .gitleaksignore) end up in the
      # Security tab.
      - name: Gitleaks scan (gate)
        id: gate
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Gitleaks scan (SARIF for Security tab)
        if: always()
        run: |
          gitleaks detect --source . --redact --report-format sarif --report-path gitleaks.sarif --exit-code 0

      - name: Upload gitleaks results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      # EXPERIMENT (throw-away branch): a dispatched run reports its real result as a
      # check on the commit it scanned, because the check of a dispatched job is not
      # picked up by the pull request that has this commit as its head.
      - name: Report the result as a check on the scanned commit (dispatch only)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          [ "$OUTCOME" = success ] && C=success || C=failure
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name="🔒 Gitleaks"             -f head_sha="${GITHUB_SHA}" -f status=completed -f conclusion="$C"             -f "output[title]=gitleaks gate: ${OUTCOME}"             -f "output[summary]=Result of the gate step of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} for ${GITHUB_SHA}." >/dev/null
