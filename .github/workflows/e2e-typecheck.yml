name: "E2E - typecheck"

# Cheap PR gate for the e2e/ directory: dependencies install and the TypeScript compiles.
# The real chain (e2e-staging.yml) needs secrets and the staging cluster and runs separately.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - "e2e/**"
      - ".github/workflows/e2e-typecheck.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: "E2E typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck
