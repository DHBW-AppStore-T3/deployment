name: "🖥️ noVNC Proxy Image"

on:
  push:
    branches: [main, dev]
    paths:
      - "docker/novnc-proxy/**"
  pull_request:
    paths:
      - "docker/novnc-proxy/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dhbw-appstore-t3/novnc-proxy

jobs:
  build-and-push:
    name: "🐳 Build & Push"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test the proxy against a fake Kubernetes API
        run: |
          pip install aiohttp==3.11.11
          python docker/novnc-proxy/test_proxy.py

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'dev' }}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker/novnc-proxy
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
