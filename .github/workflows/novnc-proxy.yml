name: "🖥️ noVNC Proxy Image"

on:
  push:
    branches: [main, dev]
    paths:
      - "docker/novnc-proxy/**"
  pull_request:
    paths:
      - "docker/novnc-proxy/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dhbw-appstore-t3/novnc-proxy

jobs:
  build-and-push:
    name: "🐳 Build & Push"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # sign the image's origin (Sigstore, keyless)
      attestations: write   # store that signature with GitHub
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built once for the test and the scan; the push below takes its layers from the same cache.
      # SECURITY_REFRESH (the run id) makes the apk upgrade in the Dockerfile run in every build.
      - name: Build (local, for the test and the scan)
        uses: docker/build-push-action@v6
        with:
          context: docker/novnc-proxy
          load: true
          tags: novnc-proxy:scan
          cache-from: type=gha,scope=novnc-proxy
          cache-to: type=gha,mode=max,scope=novnc-proxy
          build-args: SECURITY_REFRESH=${{ github.run_id }}

      # In the image itself (its Python and aiohttp), not on the runner's.
      - name: Test the proxy against a fake Kubernetes API
        run: |
          docker run --rm -v "$PWD/docker/novnc-proxy:/src:ro" --entrypoint python3 novnc-proxy:scan /src/test_proxy.py

      - name: Trivy scan (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: novnc-proxy:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'dev' }}
            type=sha,prefix=sha-

      - name: Push image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker/novnc-proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=novnc-proxy
          build-args: SECURITY_REFRESH=${{ github.run_id }}

      # Signs which repository, workflow, branch and commit built this digest (SLSA
      # build provenance, keyless); k8s-bump.yml rolls out only images that have it
      # (.github/scripts/verify-image.sh).
      - name: Attest the image's origin
        if: github.event_name != 'pull_request' && steps.build.outputs.digest != ''
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

  # Pins the image just pushed (by digest) in k8s/images/<staging|prod>.yaml:
  # k8s-bump.yml (this repository) writes it, a PR on dev merges itself, a PR on
  # main waits for a person. Never on pull requests.
  k8s-rollout:
    name: "☸️ Pin in k8s/images"
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      actions: write   # dispatch k8s-bump.yml in this repository
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Dispatch k8s-bump
        run: |
          gh workflow run k8s-bump.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f component=novnc-proxy -f tag="sha-${GITHUB_SHA::7}" -f digest="$DIGEST"
        env:
          # A dispatch by the GITHUB_TOKEN is allowed within the same repository
          # (workflow_dispatch is exempt from the "no recursive runs" rule).
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
