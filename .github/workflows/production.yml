name: CD - Production Deployment

# Push to main only happens through a merged, reviewed PR (branch
# protection on main requires that) - so a push here already carries the
# human gate the team wants for production. workflow_dispatch exists for a
# manual re-run (e.g. after fixing a secret) without needing an empty commit.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      moodle_enabled:
        description: "Also deploy the Moodle LTI stack (docker-compose.moodle.yml)"
        type: boolean
        default: true
      seed_data:
        description: "Seed Keycloak users/courses/apps (only for a genuinely empty DB - creates users with password '1234')"
        type: boolean
        default: false

jobs:
  deploy:
    name: Production Deploy
    runs-on: self-hosted
    permissions:
      contents: read
      security-events: write
    env:
      OS_AUTH_URL: ${{ secrets.PROD_OS_AUTH_URL }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_SECRET }}
      OS_REGION_NAME: ${{ secrets.PROD_OS_REGION_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      # Non-blocking, same as staging: surfaces HIGH/CRITICAL IaC findings
      # without halting a production deploy on a scanner false positive.
      - name: Terraform Security Scan (Trivy)
        continue-on-error: true
        run: |
          trivy config --severity HIGH,CRITICAL infrastructure/terraform

      - name: Terraform Security Scan (Trivy, SARIF)
        if: always()
        run: |
          trivy config --severity HIGH,CRITICAL --format sarif --output trivy-iac.sarif infrastructure/terraform

      - name: Upload Trivy IaC results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac-production

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key
          ssh-keygen -y -P '' -f ~/.ssh/openstack-key > ~/.ssh/openstack-key.pub
          echo "TF_VAR_ssh_public_key=$(cat ~/.ssh/openstack-key.pub)" >> "$GITHUB_ENV"

      - name: Terraform Init, Validate, Plan & Apply
        working-directory: infrastructure/terraform/envs/production
        run: |
          terraform init
          terraform validate
          terraform plan -out=tfplan
          terraform apply tfplan
          echo "VM_IP=$(terraform output -raw vm_ip)" >> "$GITHUB_ENV"

      - name: Install Ansible and Dependencies
        run: |
          sudo apt-get install -y rsync python3-pip
          pip3 install --user --break-system-packages "ansible>=8.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ansible-galaxy role install -r infrastructure/ansible/requirements.yml -p infrastructure/ansible/roles_external
          ansible-galaxy collection install -r infrastructure/ansible/requirements.yml

      - name: Generate Ansible Inventory
        working-directory: infrastructure/ansible
        run: |
          cat > inventory.ini <<EOF
          [docker_vm]
          ${VM_IP} ansible_user=ubuntu
          EOF
          echo "Inventory:" && cat inventory.ini

      - name: Run Ansible Playbook
        working-directory: infrastructure/ansible
        run: |
          ansible-playbook -i inventory.ini \
            --private-key ~/.ssh/openstack-key \
            -e "moodle_enabled=${MOODLE_ENABLED:-true}" \
            -e "seed_data=${{ inputs.seed_data || 'false' }}" \
            production.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          ANSIBLE_FORCE_COLOR: 'True'
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          # inputs.moodle_enabled is only set on a workflow_dispatch run; on
          # a plain push, `inputs.moodle_enabled` resolves falsy (not a
          # usable `null`), so `!= false` alone still evaluated to false —
          # verified on staging's run 35980358702, which skipped every
          # moodle_enabled task despite being a push. The event_name-gated
          # expression below still isn't fully reliable either: a
          # `gh workflow run` dispatch with no explicit
          # `-f moodle_enabled=...` also produced an empty MOODLE_ENABLED
          # (staging's run 35983004855) instead of picking up the YAML
          # `default: true` — GitHub Actions doesn't reliably substitute a
          # workflow_dispatch input's default when triggered via API/CLI
          # rather than the UI form. The real safety net is therefore the
          # shell fallback below (`:-true`, not `:-false`): an empty
          # MOODLE_ENABLED now means "on", and only an explicit "false"
          # string (from a deliberate moodle_enabled: false dispatch) turns
          # it off.
          # Moodle now deploys by default on every main push too (previously
          # opt-in only) — see deployment#43 follow-up decision.
          MOODLE_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.moodle_enabled != false }}

      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f ~/.ssh/openstack-key ~/.ssh/openstack-key.pub
          rm -f infrastructure/ansible/inventory.ini
          echo "Sensitive deployment artifacts removed."
