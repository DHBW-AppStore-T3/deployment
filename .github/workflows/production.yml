name: CD - Production Deployment

# Push to main only happens through a merged, reviewed PR (branch
# protection on main requires that) - so a push here already carries the
# human gate the team wants for production. workflow_dispatch exists for a
# manual re-run (e.g. after fixing a secret) without needing an empty commit.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      seed_data:
        description: "Seed Keycloak users/courses/apps (only for a genuinely empty DB - creates users with password '1234')"
        type: boolean
        default: false

jobs:
  deploy:
    name: Production Deploy
    runs-on: self-hosted
    permissions:
      contents: read
      security-events: write
    env:
      OS_AUTH_URL: ${{ secrets.PROD_OS_AUTH_URL }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.PROD_OS_APPLICATION_CREDENTIAL_SECRET }}
      OS_REGION_NAME: ${{ secrets.PROD_OS_REGION_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      # Pinned release asset with a checksum, rather than piping install.sh
      # from the main branch into sudo sh: that installs whatever the
      # branch happens to hold at the moment the job runs, which is both
      # irreproducible and a standing supply-chain risk on a self-hosted
      # runner. Bump VERSION and SHA256 together - the hash is the one in
      # that release's trivy_<version>_checksums.txt.
      - name: Install Trivy
        env:
          TRIVY_VERSION: '0.74.0'
          TRIVY_SHA256: '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a'
        run: |
          set -euo pipefail
          curl -sSLf -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      # Non-blocking, same as staging: surfaces HIGH/CRITICAL IaC findings
      # without halting a production deploy on a scanner false positive.
      # MEDIUM and up, not HIGH,CRITICAL. OPNSTK-0003 - ingress from a
      # public CIDR - is MEDIUM, so the previous floor meant the security
      # groups were never scanned: port 22 open to ::/0 would have passed.
      # Rules that are public by design carry a #trivy:ignore: with their
      # reason, so anything reported here is exposure nobody justified.
      - name: Terraform Security Scan (Trivy)
        continue-on-error: true
        run: |
          trivy config --severity MEDIUM,HIGH,CRITICAL infrastructure/terraform

      - name: Terraform Security Scan (Trivy, SARIF)
        if: always()
        run: |
          trivy config --severity MEDIUM,HIGH,CRITICAL --format sarif --output trivy-iac.sarif infrastructure/terraform

      - name: Upload Trivy IaC results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac-production

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key
          ssh-keygen -y -P '' -f ~/.ssh/openstack-key > ~/.ssh/openstack-key.pub
          echo "TF_VAR_ssh_public_key=$(cat ~/.ssh/openstack-key.pub)" >> "$GITHUB_ENV"

      - name: Terraform Init, Validate, Plan & Apply
        working-directory: infrastructure/terraform/envs/production
        run: |
          terraform init
          terraform validate
          terraform plan -out=tfplan
          terraform apply tfplan
          echo "VM_IP=$(terraform output -raw vm_ip)" >> "$GITHUB_ENV"

      - name: Install Ansible and Dependencies
        run: |
          sudo apt-get install -y rsync python3-pip
          pip3 install --user --break-system-packages "ansible>=8.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ansible-galaxy role install -r infrastructure/ansible/requirements.yml -p infrastructure/ansible/roles_external
          ansible-galaxy collection install -r infrastructure/ansible/requirements.yml

      - name: Generate Ansible Inventory
        working-directory: infrastructure/ansible
        run: |
          cat > inventory.ini <<EOF
          [docker_vm]
          ${VM_IP} ansible_user=ubuntu
          EOF
          echo "Inventory:" && cat inventory.ini

      - name: Run Ansible Playbook
        working-directory: infrastructure/ansible
        run: |
          ansible-playbook -i inventory.ini \
            --private-key ~/.ssh/openstack-key \
            -e "seed_data=${{ inputs.seed_data || 'false' }}" \
            production.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          ANSIBLE_FORCE_COLOR: 'True'
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}

      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f ~/.ssh/openstack-key ~/.ssh/openstack-key.pub
          rm -f infrastructure/ansible/inventory.ini
          echo "Sensitive deployment artifacts removed."
