# Moodle listener — separate port (8443) on the same host/certificate
# as the main site, since appstore-prod-01 has no DNS domain to
# distinguish it by server_name (see docker-compose.moodle.yml).
#
# Loaded via the `include /etc/nginx/conf.d/*.conf;` directive in
# nginx.conf's http{} block.
server {
    listen 8443 ssl;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Moodle needs its full, unmodified path space — no prefix
    # stripping, no rewrite. moodle-network is not reachable from any
    # other prod network (see docker-compose.moodle.yml), so this
    # proxy_pass is the only path into it other than the podman-mcp/
    # SSH diagnostic route.
    location / {
        set $moodle http://moodle:80;
        proxy_pass $moodle;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  8443;
        client_max_body_size 100m;
    }
}
