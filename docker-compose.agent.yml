# ================================================================
# Agent stack — Hermes (Nous Research) as the claude-agent replacement
# from HARNESS.md System 3.2 / 3.5, plus the podman-mcp-server it talks
# to for container diagnosis. Additive to docker-compose.prod.yml:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.agent.yml up -d
#
# Governance, spelled out so it isn't just implicit in the YAML:
#
#   - Hermes never gets the Docker/Podman socket directly. All container
#     access goes through podman-mcp, and podman-mcp is only reachable
#     from the agent-network — it publishes no host port.
#   - podman-mcp's tool surface is fully read/write (container_run,
#     container_remove, image_push, ...) with no built-in allowlist.
#     The actual boundary is Hermes' own per-server MCP tool filter in
#     agent/config.yaml (include: container_list/inspect/logs only) —
#     see that file for why an allowlist and not a blocklist.
#   - agent-network is bridged to backend-network so Hermes can reach
#     backend/worker/rabbitmq/redis by name for diagnosis, but it is
#     NOT on frontend-network or keycloak-network — no path to the
#     user-facing services or the identity provider.
#   - GEMINI_API_KEY is the operator's own key (Google AI Studio),
#     never committed; required-env enforcement below fails the compose
#     invocation loudly instead of silently starting keyless.
# ================================================================
services:
  # ----------------------------------------------------------------
  # Podman MCP server — the only thing with real container access.
  # No host port published: reachable exclusively from agent-network.
  # ----------------------------------------------------------------
  podman-mcp:
    # manusa/podman-mcp-server publishes no container image (verified
    # against its .github/workflows/: build.yaml has no docker push
    # step, release.yaml only publishes to npm) — only an npm/PyPI
    # wrapper and raw linux-amd64 GitHub release binaries. This builds
    # a minimal image from the official binary instead of pulling a
    # nonexistent quay.io tag (which is what an earlier version of
    # this file did, and failed on first real deploy).
    build:
      context: ./agent
      dockerfile: podman-mcp.Dockerfile
    container_name: podman-mcp-prod
    # --port 8080 serves Streamable HTTP at /mcp and SSE at /sse
    # (verified against pkg/podman-mcp-server/cmd/root.go) — matches
    # the mcp_servers.podman.url in agent/config.yaml below.
    #
    # --podman-impl cli forces the CLI backend (which agent/
    # podman-mcp.Dockerfile makes work by aliasing `podman` to
    # `docker`). Auto-detection prefers the "api" backend (priority
    # 100 vs. cli's 50) whenever ANY podman-looking socket answers a
    # ping — including the mounted Docker socket below, since
    # Available() only pings it, it doesn't speak to it. "api" then
    # fails on the first real call because it speaks the Podman REST
    # protocol (pkg/bindings), which the Docker Engine API doesn't
    # understand. Forcing "cli" skips that trap entirely.
    command: ["--port", "8080", "--podman-impl", "cli"]
    # cmd.Execute()'s Run callback launches the HTTP server in a
    # goroutine but then blocks the main thread on ServeStdio(ctx) —
    # unconditionally, even when --port is set (verified in
    # pkg/podman-mcp-server/cmd/root.go). Without an open stdin,
    # ServeStdio hits EOF immediately, the main thread returns, and the
    # process — and the container with it — exits right after startup,
    # taking the HTTP server down with it. stdin_open keeps a pipe
    # open so ServeStdio blocks for real instead of racing edge to
    # EOF. Caught as a silent restart loop: healthy build, no panic in
    # the logs, container just exits and gets restarted every ~1s.
    stdin_open: true
    # Needs the runtime socket to inspect/list/log containers. This is
    # the one place with real docker-group-equivalent access on the
    # host — see docker-compose.agent.yml's header comment for why the
    # actual guardrail is the Hermes-side tool filter, not this mount.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agent-network
    restart: unless-stopped
    # Hermes only attempts the MCP connection at its own startup and
    # parks the server after 3 failed attempts rather than retrying —
    # if podman-mcp isn't already answering when hermes-agent starts
    # (e.g. still building, or recovering from the stdin_open bug
    # above before this fix), the MCP connection stays dead until
    # hermes-agent is manually restarted. depends_on's default
    # "started" condition doesn't wait for this — only "service_healthy"
    # does, hence this healthcheck existing at all.
    # A plain GET on the Streamable-HTTP /mcp endpoint returns 400 (it
    # rejects GET without a session), which is fine for a healthcheck:
    # -f only fails curl on 5xx by default, so a live 400 still counts
    # as healthy — the server is up and speaking HTTP, which is all
    # this needs to confirm.
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:8080/mcp"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------
  # Hermes Agent — self-improving agent, Gemini-backed, MCP client
  # for podman-mcp. Gateway mode only (no TUI on a headless prod VM).
  # ----------------------------------------------------------------
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    pull_policy: always
    container_name: hermes-agent-prod
    command: ["gateway", "run"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required — create your own key at aistudio.google.com and set it in .env, never commit it}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      # Loopback-only bind: the dashboard is reached via SSH port-
      # forward (System 3.2's SSH-only access rule), never exposed on
      # a published host port. No auth provider is configured because
      # there is no non-loopback listener for the auth gate to guard.
      #
      # Discord (HARNESS.md System 3.2 revision): the one deliberate
      # exception to "SSH-only, no network endpoint" — Discord is the
      # team's actual communication channel, so this trades the
      # blanket rule for an explicit one: DISCORD_ALLOWED_USERS is the
      # real boundary, not network topology. The bot's own Public Bot
      # flag must stay OFF on Discord's side (manual invite URL only)
      # so it can't be found or joined by anyone outside the org
      # either — the allowlist alone isn't the whole story, an
      # invite-only bot is the other half.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required — create a private (Public Bot = OFF) bot at discord.com/developers/applications, see docs/prod-setup.md}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:?DISCORD_ALLOWED_USERS is required — comma-separated Discord user IDs, never leave this unset or every Discord user can talk to the agent}
      # Optional — only resolved if agent/config.yaml's commented-out
      # `github` MCP server block is uncommented. Not required (no
      # :?) because the feature itself is not yet activated (HARNESS.md
      # System 2 status). A read-only-scoped PAT, never the token a
      # human uses for git operations.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - hermes_agent_data:/opt/data
      - ./agent/config.yaml:/opt/data/config.yaml:ro
    depends_on:
      podman-mcp:
        condition: service_healthy
    networks:
      - agent-network
      - backend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hermes_agent_data:
    driver: local

networks:
  agent-network:
    driver: bridge
    name: agent-network-prod
  # backend-network must already exist (created by docker-compose.prod.yml).
  # Declared external here so this file can be composed on top of prod
  # without redefining it.
  backend-network:
    external: true
    name: backend-network-prod
