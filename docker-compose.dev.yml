# ================================================================
# Local Development Stack (.github#6)
#
# Runs without OpenStack, Keycloak, Redis or RabbitMQ.
# Pod-apps deploy against FakeKube (no cluster needed).
#
# Usage:
#   make init           # first start: up + migrate + seed
#   make dev-up         # subsequent starts
#   make dev-down       # stop
# ================================================================

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak-sim
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ../deployment/keycloak/dhbw-realm.json:/opt/keycloak/data/import/dhbw-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - sim-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres-sim
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-backend_dev}
    volumes:
      - postgres_sim_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sim-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: backend-sim
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-backend_dev}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      APP_ENV: "development"
      OPENSTACK_SIMULATE: "true"
      KEYCLOAK_SERVER_URL: "http://keycloak-sim:8081"
      KEYCLOAK_ISSUER: "http://localhost:8081/realms/dhbw"
      KEYCLOAK_REALM: "dhbw"
      KEYCLOAK_CLIENT_ID: "appstore-backend"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-local-secret}
      OIDC_ALLOWED_CLIENTS: "appstore-frontend"
      OIDC_AUDIENCE: "appstore-api"
      LTI13_SESSION_SECRET: "change-me-in-dev"
      HANDOFF_SESSION_SECRET: "change-me-in-dev"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/.venv
      - backend_sim_repos:/tmp/repos
    networks:
      - sim-network

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile.dev
    container_name: worker-sim
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-backend_dev}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      RESULTS_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      APPSTORE_API_URL: http://backend:8000
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN:-}
      APP_ENV: "development"
      WORKER_SIMULATE: "true"
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../worker:/app
      - /app/.venv
    networks:
      - sim-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-sim
    environment:
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5173}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      VITE_KEYCLOAK_URL: "http://localhost:8081"
      VITE_KEYCLOAK_REALM: "dhbw"
      VITE_KEYCLOAK_CLIENT_ID: "appstore-frontend"
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - sim-network

volumes:
  postgres_sim_data:
    driver: local
  backend_sim_repos:
    driver: local

networks:
  sim-network:
    driver: bridge
    name: sim-network-dev
