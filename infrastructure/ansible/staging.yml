---
- name: 2. CONFIGURE Docker and Deploy Application on Staging Environment
  hosts: docker_vm
  become: yes
  gather_facts: yes

  vars:
    docker_users: ["ubuntu"]
    docker_install_compose: true
    project_root: "/home/ubuntu/app"
    local_compose_path: "{{ playbook_dir }}/../../"
    # Vom Workflow über -e gesetzt. Der Default gilt, wenn das Playbook von
    # Hand läuft: ein Deploy fasst keine Anwendungsdaten an, solange es nicht
    # ausdrücklich verlangt wird.
    seed_data: false
    # Muss zu docker_data_volume_size_gb in envs/staging passen — beide jetzt
    # aktiv (50GB / /dev/vdb, wie beim Forgejo-Host), nachdem die Root-Disk
    # (10GB) mit Moodle dazu tatsächlich ausging ("no space left on device").
    docker_data_device: "/dev/vdb"
    # Vom Workflow über -e gesetzt. Default true: Moodle deployt inzwischen
    # standardmäßig mit (deployment#43 Follow-up-Entscheidung) — das Flag
    # bleibt nur als expliziter Abschalt-Weg über workflow_dispatch erhalten.
    # compose_files wird an jeder `docker compose -f ...`-Stelle unten
    # verwendet statt die Datei jedes Mal einzeln zu benennen, damit ein
    # zweites Overlay an nur einer Stelle hinzukommt statt an den derzeit acht.
    moodle_enabled: true
    # Muss zu MOODLE_REPO_PATH im STAGING_ENV_FILE-Secret passen, wenn
    # moodle_enabled gesetzt ist — docker-compose.staging.moodle.yml liest
    # MOODLE_REPO_PATH aus .env, dieser Task-Satz klont dorthin.
    moodle_repo_path: "/home/ubuntu/moodle_appstore"
    compose_files: >-
      -f docker-compose.staging.yml
      {{ '-f docker-compose.staging.moodle.yml' if moodle_enabled | bool else '' }}

  pre_tasks:
    # Das zweite Interface hängt Terraform an die laufende VM, konfiguriert ist
    # es damit nicht - cloud-init läuft nur beim ersten Boot.
    #
    # Die eigene Routing-Tabelle ist nicht optional: Antworten von der
    # IPv4-Adresse müssen über deren Gateway hinaus, sonst verwirft Neutrons
    # Port-Security sie als gefälschte Absenderadresse.
    - name: Netplan für das sekundäre IPv4-Interface schreiben
      when: secondary_mac | default('') | length > 0
      ansible.builtin.copy:
        dest: /etc/netplan/60-secondary-ipv4.yaml
        owner: root
        group: root
        mode: '0600'
        content: |
          network:
            version: 2
            ethernets:
              secondary:
                match:
                  macaddress: "{{ secondary_mac }}"
                dhcp4: true
                dhcp4-overrides:
                  use-routes: false
                routes:
                  - to: default
                    via: "{{ secondary_gateway }}"
                    table: 100
                routing-policy:
                  - from: "{{ secondary_ipv4 }}"
                    table: 100
      register: netplan_secondary
      tags: [network]

    # Fasst nur das neue Interface an; die Verbindung dieses Playbooks läuft
    # über IPv6 auf dem primären und bleibt bestehen.
    - name: Netplan anwenden
      when: netplan_secondary is changed
      ansible.builtin.command: netplan apply
      changed_when: true
      tags: [network]

    # Die Regel oben erfasst nur Antworten, die der Host selbst erzeugt - darum
    # funktioniert SSH und ein veröffentlichter Port nicht: Docker leitet die
    # Anfrage per DNAT weiter, bevor geroutet wird, die Antwort trägt also noch
    # die Adresse des Containers als Absender und die Regel greift nicht. Sie
    # geht dann über das primäre Interface hinaus, mit einer Adresse, die dieser
    # Port nicht führen darf, und Neutron verwirft sie. Die Verbindung zu
    # markieren statt die Adresse zu prüfen deckt beide Fälle ab.
    #
    # Ein Skript statt des iptables-Moduls, weil die Regeln einen Neustart
    # überstehen müssen. mangle verwaltet Docker nicht, es kollidiert also
    # nichts mit dessen Ketten.
    - name: Connmark-Skript installieren
      ansible.builtin.copy:
        dest: /usr/local/sbin/secondary-ipv4-marks.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/sh
          set -eu

          iface=$(ip -o -4 addr show \
            | awk '$4 ~ /^{{ secondary_ipv4 }}\// {print $2; exit}')
          [ -n "$iface" ] || exit 0

          add() {
            iptables -t mangle -C "$@" 2>/dev/null || iptables -t mangle -A "$@"
          }

          # Entfernt eine frühere Fassung der Restore-Regel ohne Bedingung.
          iptables -t mangle -D PREROUTING -j CONNMARK --restore-mark \
            2>/dev/null || true

          add PREROUTING -i "$iface" -m conntrack --ctstate NEW \
            -j CONNMARK --set-mark 100

          # Nie auf dem sekundären Interface selbst. Wäre auch die Anfrage
          # markiert, ginge sie in die Tabelle unten statt weiter zum Container.
          add PREROUTING ! -i "$iface" -j CONNMARK --restore-mark
          add OUTPUT -j CONNMARK --restore-mark

          # ip rule gibt die Marke hexadezimal aus, daher 0x64.
          ip rule show | grep -q 'fwmark 0x64 lookup 100' \
            || ip rule add fwmark 100 table 100 priority 32764
      register: marks_script
      tags: [network]

    - name: Unit installieren, die die Marken beim Booten neu setzt
      ansible.builtin.copy:
        dest: /etc/systemd/system/secondary-ipv4-marks.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Connection marks for the secondary IPv4 interface
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/secondary-ipv4-marks.sh

          [Install]
          WantedBy=multi-user.target
      register: marks_unit
      tags: [network]

    - name: Aktivieren und ausführen
      when: marks_script is changed or marks_unit is changed
      ansible.builtin.systemd:
        name: secondary-ipv4-marks.service
        enabled: true
        state: restarted
        daemon_reload: true
      tags: [network]

    # Das Volume muss hängen, bevor Docker dort Daten anlegt. Über ein
    # gefülltes /var/lib/docker gelegt, verschwinden Images, Container und
    # benannte Volumes für den Daemon, ohne Fehlermeldung.
    - name: Datenvolume vorhanden?
      ansible.builtin.stat:
        path: "{{ docker_data_device }}"
      register: data_device
      when: docker_data_device | length > 0

    - name: Abbrechen, wenn das erwartete Volume fehlt
      ansible.builtin.fail:
        msg: >-
          {{ docker_data_device }} existiert nicht. Entweder wurde die VM ohne
          docker_data_volume_size_gb gebaut - dann docker_data_device auf ""
          setzen - oder das Volume hängt unter anderem Namen. Vorhanden:
          {{ ansible_devices.keys() | list | join(', ') }}
      when:
        - docker_data_device | length > 0
        - not data_device.stat.exists

    # force: no ist die tragende Zeile. Ohne sie formatiert der nächste
    # Playbook-Lauf das Volume neu und löscht beide Datenbanken.
    - name: Dateisystem auf dem Datenvolume anlegen
      community.general.filesystem:
        fstype: ext4
        dev: "{{ docker_data_device }}"
        force: no
      when: docker_data_device | length > 0

    # Über die UUID statt /dev/vdb, weil Gerätenamen sich beim Booten
    # verschieben können, sobald ein zweites Volume dazukommt.
    - name: UUID des Datenvolumes lesen
      ansible.builtin.command: blkid -s UUID -o value {{ docker_data_device }}
      register: data_uuid
      changed_when: false
      when: docker_data_device | length > 0

    # Docker und containerd müssen stehen, bevor das Volume gemountet wird —
    # sonst halten die laufenden Daemons offene Dateihandles auf die
    # Root-Disk-Kopien darunter, ein `mounted`-State-Wechsel allein bringt sie
    # nicht dazu, sie loszulassen oder das neue, leere Volume überhaupt zu
    # bemerken. Auf einer frischen VM sind die Services noch gar nicht
    # angelegt, daher failed_when statt einem harten Fehler bei "not found".
    - name: Docker und containerd vor dem Volume-Mount stoppen (falls schon aktiv)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: [docker, containerd]
      when: docker_data_device | length > 0
      failed_when: false

    - name: Datenvolume unter /var/lib/docker einhängen
      ansible.posix.mount:
        path: /var/lib/docker
        src: "UUID={{ data_uuid.stdout | trim }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted
      when: docker_data_device | length > 0
      register: docker_data_mount

    # Der alte, jetzt vom obigen Mount verdeckte Inhalt der Root-Disk unter
    # /var/lib/containerd bleibt belegt, auch wenn er unsichtbar ist —
    # dasselbe Muster wie bei /var/lib/docker (siehe dessen Kommentar weiter
    # oben zum Datenvolume-Check), nur diesmal auf dem Verzeichnis, das den
    # eigentlichen Space-Fehler verursacht hat. Gelöscht statt einfach
    # verdeckt, weil containerd zu diesem Zeitpunkt bereits gestoppt ist und
    # nichts mehr davon offen hält, und weil dies erst nach dem eigenen
    # Volume-Mount läuft, also auch bei einem docker_data_device="" (Root-
    # Disk-only) niemals Root-Disk-Speicher wegwirft, den man tatsächlich
    # noch braucht.
    # Idempotenz: ein früherer Lauf kann /var/lib/containerd bereits
    # bind-gemountet haben (z. B. teilweise durchgelaufen, dann an einem
    # späteren Task gescheitert) — ein "absent" gegen ein gemountetes
    # Verzeichnis scheitert mit "Device or resource busy", weil der Kernel
    # kein rmdir/rmtree über eine aktive Mountpoint-Grenze hinweg erlaubt.
    - name: /var/lib/containerd aushängen, falls von einem früheren Lauf bereits gemountet
      ansible.posix.mount:
        path: /var/lib/containerd
        state: unmounted
      when: docker_data_device | length > 0
      failed_when: false

    - name: Alten containerd-Inhalt unter der neuen Root-Disk-Ansicht löschen
      ansible.builtin.file:
        path: /var/lib/containerd
        state: absent
      when: docker_data_device | length > 0

    - name: /var/lib/containerd neu anlegen (jetzt auf der Root-Disk, gleich bind-gemountet)
      ansible.builtin.file:
        path: /var/lib/containerd
        state: directory
        mode: '0711'
      when: docker_data_device | length > 0

    # /var/lib/containerd ist NICHT Teil von /var/lib/docker — Docker läuft
    # auf containerd als separatem Daemon mit eigenem Datenverzeichnis, dessen
    # größter Teil (der overlayfs-Snapshotter, wo entpackte Image-Layer
    # liegen) komplett am obigen Mount vorbei auf der Root-Disk landet. Genau
    # das ließ den ersten Moodle-Deploy mit "no space left on device" auf
    # /dev/vda1 (94% voll, containerd allein 4GB) scheitern, obwohl
    # /var/lib/docker selbst zu diesem Zeitpunkt schon auf dem fast leeren
    # 49GB-Volume lag. Ein Bind-Mount unter das ohnehin schon größere
    # Datenvolume ist einfacher als containerds eigene config.toml auf einen
    # neuen "root"-Pfad umzuschreiben, und braucht kein zusätzliches
    # ext4-Dateisystem.
    # Muss UNTER /var/lib/docker liegen, nicht neben ihm — das Verzeichnis ist
    # sonst selbst wieder nur auf der Root-Disk angelegt und der Bind-Mount
    # darunter löst exakt nichts. /var/lib/docker ist an dieser Stelle
    # bereits der obige Mount, also physisch auf dem Datenvolume.
    - name: Verzeichnis für containerd-Daten auf dem Datenvolume anlegen
      ansible.builtin.file:
        path: /var/lib/docker/containerd-data
        state: directory
        mode: '0711'
      when: docker_data_device | length > 0

    - name: /var/lib/containerd auf das Datenvolume bind-mounten
      ansible.posix.mount:
        path: /var/lib/containerd
        src: /var/lib/docker/containerd-data
        fstype: none
        opts: bind
        state: mounted
      when: docker_data_device | length > 0
      register: containerd_data_mount

    # Immer starten, nicht nur bei "mount is changed": der vorausgehende
    # "stoppen"-Task lässt beide Daemons so oder so tot zurück, wenn sie
    # liefen, und ein Lauf, der die Mounts schon in einem früheren
    # Playbook-Durchlauf eingerichtet, die Daemons aber nie neu gestartet
    # hatte, meldet sie selbst als "ok" (unverändert) und würde diesen
    # Schritt sonst überspringen — genau der Zustand, der den ersten
    # Moodle-Deploy trotz bereits angehängtem Volume hat scheitern lassen.
    # containerd zuerst, docker hängt an dessen Socket.
    - name: containerd und Docker nach den Volume-Mounts (wieder) starten
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        daemon_reload: true
      loop: [containerd, docker]
      when: docker_data_device | length > 0
      # Gleiche Begründung wie beim Stop-Task oben: auf einer frischen VM
      # existieren die Units noch nicht (geerlingguy.docker läuft erst danach
      # in `roles:`) - "Could not find the requested service" ist dort kein
      # Fehler, sondern der Normalfall beim allerersten Deploy einer neuen
      # Instanz. Der Rollen-Schritt gleich danach installiert und startet
      # beide Services ohnehin.
      failed_when: false

    # Auf einer frischen VM ist an dieser Stelle (noch vor `roles:`) weder
    # ein containerd-Reset noch ein Docker-Daemon je passiert - die beiden
    # folgenden Aufräum-Tasks setzen aber voraus, dass die `docker`-CLI
    # bereits existiert (sie greifen genau den Zwischenzustand eines
    # REDEPLOYS auf einer schon einmal provisionierten VM ab). Ohne diesen
    # Check bricht der allererste Deploy einer neuen Instanz mit "No such
    # file or directory: 'docker'" ab, obwohl es hier schlicht nichts zum
    # Aufräumen gibt.
    - name: Prüfen, ob die docker-CLI schon existiert
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_cli

    # BuildKits eigener Cache liegt separat von den Image-Layern und
    # überlebt den obigen containerd-Reset als Referenzen auf Content-Blobs,
    # die dort nicht mehr existieren — der nächste appstore-caddy-Build
    # scheiterte mit "failed to get reader from content store: ... not
    # found", weil BuildKit einen zwischengespeicherten Layer wiederverwenden
    # wollte, den es unter der neuen, leeren containerd-Instanz nicht mehr
    # gibt. `docker builder prune` statt containerd selbst anzufassen, weil
    # das nur BuildKits eigenen State betrifft, nicht die bereits gepullten
    # Runtime-Images (die kommen aus demselben Content-Store, sind aber zu
    # diesem Zeitpunkt schon vollständig heruntergeladen und intakt).
    - name: BuildKit-Cache leeren (überlebt den containerd-Reset als stale Referenzen)
      ansible.builtin.command: docker builder prune -af
      when: docker_data_device | length > 0 and docker_cli.stat.exists
      changed_when: true

    # Dockers eigene Container-Metadaten unter /var/lib/docker/containers/
    # (auf dem Datenvolume, nicht vom containerd-Reset betroffen) können auf
    # Container verweisen, deren containerd-Snapshot-Layer nach dem Reset
    # nicht mehr existiert — "Error response from daemon: RWLayer of
    # container ... is unexpectedly nil" beim nächsten `up`.
    #
    # Unconditional bei gesetztem docker_data_device, nicht nur "wenn der
    # Mount in diesem Lauf changed war": derselbe Grund wie beim
    # Docker-Neustart-Task oben — ein Mount, der in einem früheren, an einem
    # späteren Task gescheiterten Durchlauf schon passiert ist, meldet sich
    # selbst als "ok", und genau dieser Zwischenzustand (containerd frisch
    # zurückgesetzt, Docker kennt noch alte Container) ist real aufgetreten.
    # Für staging (kein Uptime-SLA) ist ein `up -d --build` gleich danach
    # billiger als die Erkennung, ob es diesmal wirklich nötig wäre.
    - name: Verwaiste Container nach einem containerd-Reset entfernen
      ansible.builtin.shell: |
        set -eu
        ids=$(docker ps -aq)
        if [ -n "$ids" ]; then
          docker rm -f $ids
        fi
      when: docker_data_device | length > 0 and docker_cli.stat.exists
      changed_when: true

    - name: Verzeichnis für App erstellen
      ansible.builtin.file:
        path: "{{ project_root }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

  roles:
    - role: geerlingguy.docker
      tags: [docker_install]

  tasks:
    - name: Docker-Compose Datei kopieren
      ansible.posix.synchronize:
        src: "{{ local_compose_path }}"
        dest: "{{ project_root }}"
        recursive: yes
        delete: yes
        rsync_opts:
          - "--exclude=.ssh"
          - "--exclude=.git"
          - "--exclude=.history"
          - "--exclude=docker-compose.override.yml"
          - "--exclude=node_modules"
          - "--exclude=__pycache__"
          - "--exclude=.venv"
          - "--exclude=.terraform"
          - "--exclude=frontend/dist"
          - "--exclude=frontend/test-results"
          - "--exclude=frontend/blob-report"
          - "--exclude=.DS_Store"
          - "--exclude=*.pyc"
          - "--exclude=.env"

    - name: .env auf VM schreiben
      ansible.builtin.copy:
        content: "{{ lookup('env', 'STAGING_ENV_FILE') }}"
        dest: "{{ project_root }}/.env"
        owner: ubuntu
        group: ubuntu
        # 0644, nicht 0600: docker-compose.staging.yml mountet diese Datei
        # jetzt genau wie prod direkt in den Backend-Container
        # (./.env:/app/.env, für CORS_ORIGINS - siehe dort), dessen appuser
        # mit UID 999 läuft. Gleicher Fix wie production.yml, aus demselben
        # Grund: eine 0600-Datei, die UID 1000 (ubuntu) gehört, ist für
        # UID 999 unlesbar.
        mode: '0644'

    # moodle_appstore ist ein eigenes Repo (Moodle-Core-Fork), kein Teil
    # dieses rsync-Schritts — docker-compose.staging.moodle.yml mountet
    # es über MOODLE_REPO_PATH als Document Root. Auf Prod (docker-
    # compose.moodle.yml) wurde das einmalig von Hand geklont; hier
    # automatisiert, damit `moodle_enabled=true` allein reicht.
    # Ansible läuft mit become: yes (root), git prüft den Owner des .git-Verzeichnisses
    # gegen den ausführenden User (CVE-2022-24765-Härtung) — ein Verzeichnis, das aus
    # irgendeinem Grund nicht root gehört (z. B. ein vorheriger manueller Debug-Zugriff
    # als anderer User), lässt jeden weiteren git-Aufruf mit "dubious ownership"
    # scheitern, bevor er den eigentlichen Klon/Pull überhaupt versucht.
    - name: Git safe.directory für den Moodle-Klon setzen
      when: moodle_enabled | bool
      ansible.builtin.command:
        cmd: git config --global --add safe.directory {{ moodle_repo_path }}
      changed_when: false

    - name: moodle_appstore für die Moodle-Instanz klonen
      when: moodle_enabled | bool
      ansible.builtin.git:
        repo: https://github.com/DHBW-AppStore-T3/moodle_appstore.git
        dest: "{{ moodle_repo_path }}"
        version: main
        force: yes

    # www-data im moodlehq/moodle-php-apache-Image ist UID/GID 33 — ohne das
    # hier zu setzen bleibt der frische Klon root-eigen, und Apache kann
    # weder config.php schreiben noch moodledata beschreiben (derselbe
    # Permission-denied-Fehler, der auf appstore-prod-01 einen nachträglichen
    # manuellen `chown 33:33` nötig machte).
    - name: Repo-Rechte für www-data (UID 33) setzen
      when: moodle_enabled | bool
      ansible.builtin.file:
        path: "{{ moodle_repo_path }}"
        owner: "33"
        group: "33"
        recurse: yes

    - name: APP_BASE_URL aus .env lesen
      ansible.builtin.shell:
        cmd: |
          grep -E '^APP_BASE_URL=' "{{ project_root }}/.env" \
            | head -n1 | cut -d= -f2- | tr -d '"'"'"'\r'
        executable: /bin/bash
      register: app_base_url_raw
      changed_when: false

    # Kein Schritt für ein selbstsigniertes Zertifikat mehr: Caddy holt sich
    # eines vom ACME-Endpunkt der DHBW und erneuert es selbst. Das alte
    # openssl-Zertifikat lautete ohnehin auf die IP der VM und wurde bei jedem
    # Adresswechsel ungültig.

    - name: Keycloak realm-export.json aus Template rendern
      ansible.builtin.template:
        src: "{{ local_compose_path }}/keycloak/realm-export.json.j2"
        dest: "{{ project_root }}/keycloak/realm-export.json"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      vars:
        app_base_url: "{{ app_base_url_raw.stdout | trim }}"
        app_api_url: "{{ app_base_url_raw.stdout | trim }}/api"

    # Der NGINX_CONFIG_HASH-Trick entfällt: er existierte nur, weil Compose
    # eine inhaltliche Änderung an der bind-gemounteten nginx.conf nicht
    # bemerkt und der Container deshalb über ein Label-Drift neu erzeugt
    # werden musste. Der Caddyfile ist ebenso bind-gemountet, aber Caddy lädt
    # ihn über den Reload-Schritt am Playbook-Ende neu — validiert und ohne
    # Unterbrechung, statt den Container wegzuwerfen.

    - name: Log in to GHCR using credentials from the deployed .env
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          env_file="{{ project_root }}/.env"
          token=$(grep -E '^GIT_ACCESS_TOKEN=' "$env_file" 2>/dev/null | head -n1 | cut -d= -f2- | tr -d '\042\047\r' || true)
          user=$(grep -E '^GIT_USER=' "$env_file" 2>/dev/null | head -n1 | cut -d= -f2- | tr -d '\042\047\r' || true)
          if [ -z "$token" ]; then
            echo "no GIT_ACCESS_TOKEN in $env_file - skipping GHCR login"
            exit 0
          fi
          echo "$token" | docker login ghcr.io --username "${user:-x}" --password-stdin
        executable: /bin/bash
      changed_when: true

    - name: Pull alle Images
      ansible.builtin.shell:
        # --ignore-buildable überspringt Dienste mit build:-Abschnitt. Ohne das
        # versucht compose auch appstore-caddy:rfc2136 zu ziehen, das nur lokal
        # gebaut wird und in keiner Registry liegt - der Pull scheitert und
        # bricht das Playbook an dieser Stelle ab, noch bevor der Stack
        # überhaupt neu gestartet wird.
        cmd: docker compose {{ compose_files }} pull --ignore-buildable
        chdir: "{{ project_root }}"
      changed_when: true
      async: 600
      poll: 30

    - name: GHCR credentials aus root-Store entfernen
      ansible.builtin.file:
        path: /root/.docker/config.json
        state: absent

    # Validiert die zusammengesetzte Konfiguration, bevor das Modul übernimmt.
    # Der Schritt existiert nur wegen der Diagnose: docker_compose_v2 ruft
    # `compose images --format json` auf und liest ausschließlich stdout.
    # Bricht Compose ab — etwa weil eine ${VAR:?...}-Pflichtvariable in der .env
    # fehlt — steht die Erklärung auf stderr, stdout bleibt leer, und das Modul
    # meldet stattdessen "Expecting value: line 1 column 1 (char 0)". Diese
    # Meldung sagt nichts über die Ursache und hat schon einmal eine ganze
    # Fehlersuche in die falsche Richtung geschickt.
    #
    # `config -q` interpoliert dieselbe Datei, gibt bei Erfolg nichts aus und
    # nennt im Fehlerfall die betroffene Variable — Ansible zeigt stderr an.
    - name: Compose-Konfiguration validieren
      ansible.builtin.command:
        cmd: docker compose {{ compose_files }} config -q
        chdir: "{{ project_root }}"
      changed_when: false

    # Ein expliziter Befehl statt community.docker.docker_compose_v2, aus zwei
    # Gründen 
    #
    # Erstens verschluckt das Modul Fehler: es liest den Zustand über
    # `compose images --format json` und wertet nur stdout aus. Bricht Compose
    # ab, steht die Meldung auf stderr und das Modul meldet stattdessen
    # "Expecting value: line 1 column 1".
    #
    # Zweitens baut es in einem eigenen Schritt vor dem Start. Buildx vergibt
    # dabei jedes Mal eine neue Image-ID (die Provenance-Manifeste tragen
    # Zeitstempel), das Tag wandert mit, und die alte ID wird entsorgt — obwohl
    # der laufende caddy-staging noch auf sie zeigt. Der anschließende
    # Zustandsabruf findet dieses Image nicht mehr und bricht ab, bevor `up`
    # den Container ersetzen kann. Der Container bleibt damit dauerhaft auf
    # einer toten ID stehen und jeder weitere Lauf scheitert genauso.
    #
    # `up -d --build` baut und ersetzt in einem Zug, also bleibt kein Container
    # auf einem entsorgten Image zurück.
    - name: Start the application with Docker Compose
      ansible.builtin.command:
        cmd: docker compose {{ compose_files }} up -d --build
        chdir: "{{ project_root }}"
      register: compose_output
      changed_when: true

    # TEMPORARY debugging task for the moodle-staging TLS certificate issue —
    # remove once resolved. Waits for Caddy's ACME retry cycle to run at
    # least once, then surfaces its logs directly in the GitHub Actions
    # output, since a live SSH window during the run is too short to
    # reliably grab them from outside.
    - name: DEBUG - warten und Caddy-Logs ausgeben (temporär)
      when: moodle_enabled | bool
      ansible.builtin.pause:
        seconds: 90

    - name: DEBUG - Caddy-Logs (temporär)
      when: moodle_enabled | bool
      ansible.builtin.command: docker logs caddy-staging
      register: debug_caddy_logs
      changed_when: false

    - name: DEBUG - Caddy-Logs ausgeben (temporär)
      when: moodle_enabled | bool
      ansible.builtin.debug:
        msg: "{{ debug_caddy_logs.stdout_lines + debug_caddy_logs.stderr_lines }}"

    # `up -d --build` baut Caddy neu, ersetzt den Container aber nicht, wenn
    # sich nur die Image-ID geändert hat: Compose entscheidet darüber anhand der
    # Service-Definition, und die bleibt gleich. Der Container läuft dann weiter
    # auf dem vorigen Image, das kein Tag mehr trägt und irgendwann eingesammelt
    # wird — danach lässt er sich nicht mehr starten.
    #
    # Deshalb der Vergleich statt eines pauschalen --force-recreate: das würde
    # den Proxy bei jedem Deploy kurz aus dem Netz nehmen, auch wenn sich am
    # Image nichts geändert hat.
    - name: Prüfen, ob Caddy auf dem aktuellen Image läuft
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          tagged=$(docker image inspect appstore-caddy:rfc2136 \
                   --format '{% raw %}{{.Id}}{% endraw %}')
          running=$(docker inspect caddy-staging \
                    --format '{% raw %}{{.Image}}{% endraw %}' 2>/dev/null || echo none)
          [ "$tagged" = "$running" ] && echo current || echo stale
        executable: /bin/bash
        chdir: "{{ project_root }}"
      register: caddy_image_state
      changed_when: false

    - name: Caddy auf das neu gebaute Image heben
      ansible.builtin.command:
        cmd: >-
          docker compose {{ compose_files }}
          up -d --force-recreate --no-deps caddy
        chdir: "{{ project_root }}"
      when: caddy_image_state.stdout == "stale"

    # Migrations live OUTSIDE the compose file on purpose: a previous
    # backend-migrate init container buried failure stderr inside the
    # compose JSON. Running alembic as its own playbook step surfaces
    # both the migration's exit code and its stderr directly in the
    # Ansible task output.
    - name: Wait for backend container to be running
      ansible.builtin.command: docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' backend-prod
      register: backend_running
      until: backend_running.stdout == "true"
      retries: 30
      delay: 2
      changed_when: false

    - name: Apply database migrations
      ansible.builtin.command: docker exec backend-prod python -m alembic upgrade head
      register: migration_result
      changed_when: "'Running upgrade' in migration_result.stdout"

    # Das Gegenstück zu keycloak-wait im Makefile: bei leerer Datenbank startet
    # Keycloak erst Quarkus, importiert den Realm und bindet den Listener zuletzt.
    # Ein Seed davor scheitert mit "Connection refused".
    #
    # Ein TCP-Verbindungsversuch statt einer HTTP-Anfrage, weil schon das
    # gebundene Socket das gesuchte Signal ist - der Makefile muss dafür
    # Keycloaks 403 auf /realms/master gesondert behandeln.
    - name: Auf Keycloak warten
      when: seed_data | bool
      ansible.builtin.shell: |
        set -eu
        cd {{ project_root }}
        for _ in $(seq 1 60); do
          if docker compose {{ compose_files }} exec -T backend \
               python -c "import socket; socket.create_connection(('keycloak', 8080), 2)" \
               >/dev/null 2>&1; then
            exit 0
          fi
          sleep 5
        done
        echo "Keycloak nimmt nach fuenf Minuten keine Verbindungen an" >&2
        exit 1
      changed_when: false

    # Seeding läuft nach den Migrationen, weil das Skript in die Tabellen
    # schreibt, die dort erst entstehen. Es legt Keycloak-Benutzer an (Profs,
    # Studierende, ein Admin — alle mit Passwort 1234) und füllt Kurse, Apps
    # und Freigaben in der Datenbank.
    - name: Seed-Skript und Beschreibungen in den Backend-Container kopieren
      ansible.builtin.command:
        cmd: >-
          docker compose {{ compose_files }}
          cp {{ item.src }} backend:{{ item.dest }}
        chdir: "{{ project_root }}"
      loop:
        - { src: "./seed/seed_data.py", dest: "/tmp/seed_data.py" }
        - { src: "./seed/app_descriptions", dest: "/tmp/app_descriptions" }
        - { src: "./keycloak/realm-export.json", dest: "/tmp/realm-export.json" }
      when: seed_data | bool

    # Die .env wird in der Rezept-Shell gelesen, statt die Werte über Ansible
    # zu reichen: so stehen die Admin-Zugangsdaten nur in der Umgebung des
    # docker-Aufrufs und nicht im Playbook-Protokoll. Ohne sie meldet Keycloak
    # dem Skript ein 401.
    - name: Seed ausführen
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          set -a; . ./.env; set +a
          if [ -z "${KEYCLOAK_ADMIN_USER:-}" ] || [ -z "${KEYCLOAK_ADMIN_PASSWORD:-}" ]; then
            echo "KEYCLOAK_ADMIN_USER / KEYCLOAK_ADMIN_PASSWORD fehlen in der .env" >&2
            exit 1
          fi
          docker compose {{ compose_files }} exec -T \
            -e KEYCLOAK_ADMIN_USER="$KEYCLOAK_ADMIN_USER" \
            -e KEYCLOAK_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            -e REALM_EXPORT_PATH=/tmp/realm-export.json \
            backend python /tmp/seed_data.py
        executable: /bin/bash
        chdir: "{{ project_root }}"
      when: seed_data | bool
      changed_when: true

    # Der Caddyfile ist bind-gemountet, Compose bemerkt eine inhaltliche
    # Änderung daran also nicht. Dieser Reload übernimmt sie. Caddy prüft die
    # Konfiguration dabei selbst und wechselt erst bei gültigem Ergebnis —
    # eine kaputte Datei legt den laufenden Proxy nicht lahm.
    #
    # Anders als beim früheren nginx-Label-Trick ist das kein Sicherheitsnetz,
    # sondern der einzige Weg, auf dem eine Konfigurationsänderung wirksam
    # wird. failed_when bleibt deshalb bewusst nicht auf false: schlägt der
    # Reload fehl, läuft der Proxy mit einer veralteten Konfiguration weiter,
    # und das soll auffallen.
    # Auf einer wirklich frischen Instanz (kein Zertifikat existiert noch)
    # läuft der ACME-Erwerb für APP_HOSTNAME asynchron weiter, nachdem
    # "docker compose up" schon zurückgekehrt ist. Ein "caddy reload" direkt
    # danach unterbrach genau diesen Erwerb beim allerersten echten Prod-
    # Deploy (production.yml, dieselbe Codebasis): Order bei der CA
    # finalisiert, aber /data/caddy/certificates blieb leer, jeder Request
    # bekam "tlsv1 alert internal error" statt eines echten Zertifikats - bis
    # ein manueller Container-Restart den Erwerb ungestört neu laufen ließ.
    # Auf einem Redeploy mit bereits vorhandenem Zertifikat ist die Schleife
    # sofort durch.
    - name: Warten, bis Caddy mindestens ein Zertifikat besitzt
      ansible.builtin.shell:
        cmd: docker exec caddy-staging sh -c 'ls /data/caddy/certificates/*/*/*.crt 2>/dev/null | wc -l'
      register: caddy_cert_count
      until: caddy_cert_count.stdout | trim | int > 0
      retries: 24
      delay: 5
      changed_when: false

    - name: Caddy-Konfiguration neu laden
      ansible.builtin.command:
        cmd: docker exec caddy-staging caddy reload --config /etc/caddy/Caddyfile
      register: caddy_reload
      changed_when: caddy_reload.rc == 0

    # `compose_output` ist jetzt die Ausgabe des up-Befehls, nicht mehr die
    # Zustandsstruktur des Moduls. Für die Übersicht am Ende fragt dieser
    # Schritt den Zustand deshalb selbst ab.
    - name: Status der Deployment anzeigen
      ansible.builtin.command:
        cmd: docker compose {{ compose_files }} ps
        chdir: "{{ project_root }}"
      register: compose_ps
      changed_when: false

    - ansible.builtin.debug:
        var: compose_ps.stdout_lines