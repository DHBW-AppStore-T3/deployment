# ================================================================
# Self-hosted GitHub Actions runner for .github/workflows/staging.yml —
# without this, every push to main queues a staging deploy that never
# runs (verified: `gh api repos/.../actions/runners` returned an empty
# list, and every staging.yml run since 2026-09-15 sat at
# status=queued indefinitely). Additive to docker-compose.prod.yml:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.runner.yml up -d
#
# Runs on appstore-prod-01 as a container rather than a separate VM —
# no extra OpenStack quota needed, at the cost of running CI on the
# same host as prod. Isolation, to keep that cost bounded:
#
#   - network_mode: host, not a Docker network — staging.yml's Ansible
#     step SSHes to the freshly-provisioned staging VM over its public
#     IPv6 address, and Docker's own bridge networks (verified: `docker
#     network inspect bridge` shows EnableIPv6=false, and there's no
#     /etc/docker/daemon.json enabling it daemon-wide) give containers
#     no IPv6 route at all — every real run failed at "Run Ansible
#     Playbook" with "Network is unreachable" until this. Turning on
#     IPv6 daemon-wide was the alternative; rejected because it needs a
#     Docker daemon restart, which restarts every other container on
#     this host — host networking touches only this one container.
#   - Trade-off of host networking: no Docker network isolation at all
#     for this container (it can reach any port on the host, same as
#     any other host process) — a step up in blast radius from the
#     previous worker-network-only setup, accepted because there's no
#     narrower Docker-native way to hand a container the host's IPv6
#     route. Still no Docker socket mount (see below), and still no
#     path to backend/frontend/keycloak/moodle containers that isn't
#     equally available to anything else running on the VM.
#   - postgres-tfstate's 5432 is published on the host (127.0.0.1 only)
#     via docker-compose.prod.yml override below, since host-networking
#     containers can't resolve other containers by Docker DNS name —
#     PG_CONN_STR points at 127.0.0.1 instead of the service name.
#   - No Docker socket mount. staging.yml's steps are Terraform,
#     Ansible, and SSH — none of them build or run containers, so
#     this runner never needs docker-in-docker or host Docker access,
#     unlike podman-mcp (which explicitly does need the host socket
#     for its one job — see docker-compose.podman-mcp.yml).
#   - RUNNER_SCOPE=repo, single-repo token — this runner only ever
#     appears as a runner for DHBW-AppStore-T3/deployment, never
#     registered org-wide, so a compromise here can't be used to plant
#     a job on an unrelated repo's workflow.
#   - GITHUB_ACCESS_TOKEN needs `repo` scope only (to self-register via
#     the registration-token endpoint) — never the same PAT used for
#     the (currently inactive) github-mcp-server block in
#     agent/config.yaml, so a leak of one doesn't also expose the
#     other's scope.
# ================================================================
services:
  staging-runner:
    # :latest resolves to the Ubuntu 20.04 (focal) base — Python 3.8, which
    # `pip install ansible>=8.0` (staging.yml's own requirement) can't
    # satisfy: Ansible 8+ needs Python >=3.10, so pip silently offers only
    # the pre-8.0 releases and the install fails with "No matching
    # distribution found". :ubuntu-noble is the same image/maintainer on a
    # 24.04 base with a current Python.
    image: myoung34/github-runner:ubuntu-noble
    container_name: staging-runner-prod
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/DHBW-AppStore-T3/deployment
      RUNNER_NAME: appstore-prod-01-staging-runner
      RUNNER_WORKDIR: /tmp/runner/work
      # Labels are used only to make `runs-on: self-hosted` in
      # staging.yml unambiguous if a second self-hosted runner is ever
      # added for a different purpose — not a security boundary.
      LABELS: staging-deploy
      ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN:?GITHUB_ACCESS_TOKEN is required — a fine-grained PAT with just the deployment repo's Administration:write permission (to self-register), see docs/prod-setup.md}
      EPHEMERAL: "false"
      # staging.yml's Terraform step reads this directly (backend.tf's
      # `pg` backend) — same DB and credentials as postgres-tfstate's
      # own env, now addressed via the host-published port below
      # (127.0.0.1, not the container's Docker DNS name — host
      # networking means this container has no Docker DNS at all).
      PG_CONN_STR: postgres://${TFSTATE_DB_USER:?TFSTATE_DB_USER is required}:${TFSTATE_DB_PASSWORD:?TFSTATE_DB_PASSWORD is required}@127.0.0.1:55432/${TFSTATE_DB_NAME:?TFSTATE_DB_NAME is required}?sslmode=disable
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Publishes postgres-tfstate's port to 127.0.0.1 only (never
  # 0.0.0.0) — staging-runner reaches it over host networking via
  # loopback, same as any other localhost service, without exposing
  # Terraform state to the rest of the network. 55432, not 5432:
  # postgres-prod already publishes 0.0.0.0:5432 (docker-compose.prod.yml),
  # which covers 127.0.0.1 too, so 5432 is taken. Everything else about
  # this service (image, env, volume, healthcheck) comes from
  # docker-compose.prod.yml; this only adds the port mapping.
  postgres-tfstate:
    ports:
      - "127.0.0.1:55432:5432"
