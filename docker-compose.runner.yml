# ================================================================
# Self-hosted GitHub Actions runner for .github/workflows/staging.yml —
# without this, every push to main queues a staging deploy that never
# runs (verified: `gh api repos/.../actions/runners` returned an empty
# list, and every staging.yml run since 2026-09-15 sat at
# status=queued indefinitely). Additive to docker-compose.prod.yml:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.runner.yml up -d
#
# Runs on appstore-prod-01 as a container rather than a separate VM —
# no extra OpenStack quota needed, at the cost of running CI on the
# same host as prod. Isolation, to keep that cost bounded:
#
#   - worker-network only, of prod's six networks (backend-network,
#     frontend-network, worker-network, keycloak-network,
#     moodle-network, agent-network) — needed because
#     infrastructure/terraform/envs/staging/backend.tf's `pg` backend
#     stores Terraform state in postgres-tfstate (worker-network, no
#     published host port), not on the runner's own disk (a job
#     container's disk doesn't survive between runs, see that file's
#     own comment for why local state was replaced). Learned the hard
#     way: the first real run got past SSH-key setup only to fail at
#     `terraform init` with `dial tcp [::1]:5432: connection refused`
#     — PG_CONN_STR resolving to nothing reachable with no network
#     path to postgres-tfstate at all. Still no path to backend,
#     frontend, keycloak, moodle, or the agent stack by service name —
#     only the internet (OpenStack API, the staging VM it provisions,
#     GitHub) plus this one DB.
#   - No Docker socket mount. staging.yml's steps are Terraform,
#     Ansible, and SSH — none of them build or run containers, so
#     this runner never needs docker-in-docker or host Docker access,
#     unlike podman-mcp (which explicitly does need the host socket
#     for its one job — see docker-compose.agent.yml).
#   - RUNNER_SCOPE=repo, single-repo token — this runner only ever
#     appears as a runner for DHBW-AppStore-T3/deployment, never
#     registered org-wide, so a compromise here can't be used to plant
#     a job on an unrelated repo's workflow.
#   - GITHUB_ACCESS_TOKEN needs `repo` scope only (to self-register via
#     the registration-token endpoint) — never the same PAT used for
#     the (currently inactive) github-mcp-server block in
#     agent/config.yaml, so a leak of one doesn't also expose the
#     other's scope.
# ================================================================
services:
  staging-runner:
    # :latest resolves to the Ubuntu 20.04 (focal) base — Python 3.8, which
    # `pip install ansible>=8.0` (staging.yml's own requirement) can't
    # satisfy: Ansible 8+ needs Python >=3.10, so pip silently offers only
    # the pre-8.0 releases and the install fails with "No matching
    # distribution found". :ubuntu-noble is the same image/maintainer on a
    # 24.04 base with a current Python.
    image: myoung34/github-runner:ubuntu-noble
    container_name: staging-runner-prod
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/DHBW-AppStore-T3/deployment
      RUNNER_NAME: appstore-prod-01-staging-runner
      RUNNER_WORKDIR: /tmp/runner/work
      # Labels are used only to make `runs-on: self-hosted` in
      # staging.yml unambiguous if a second self-hosted runner is ever
      # added for a different purpose — not a security boundary.
      LABELS: staging-deploy
      ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN:?GITHUB_ACCESS_TOKEN is required — a fine-grained PAT with just the deployment repo's Administration:write permission (to self-register), see docs/prod-setup.md}
      EPHEMERAL: "false"
      # staging.yml's Terraform step reads this directly (backend.tf's
      # `pg` backend) — same DB and credentials as postgres-tfstate's
      # own env, just addressed by its worker-network service name.
      PG_CONN_STR: postgres://${TFSTATE_DB_USER:?TFSTATE_DB_USER is required}:${TFSTATE_DB_PASSWORD:?TFSTATE_DB_PASSWORD is required}@postgres-tfstate:5432/${TFSTATE_DB_NAME:?TFSTATE_DB_NAME is required}?sslmode=disable
    networks:
      - worker-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  worker-network:
    external: true
    name: worker-network-prod
