# Hermes Agent config — the claude-agent replacement described in
# HARNESS.md System 3.2 / 3.5. Mounted read-only into the hermes-agent
# container at /opt/data/config.yaml, on hermes-dhbw-appstore
# (deployment#49) — a dedicated VM, not an overlay on appstore-prod-01
# any more.
#
# The container-lifecycle guardrail lives here, not on the Linux user:
# podman-mcp exposes container start/remove/build/push tools with no
# built-in allowlist, so Hermes' own per-server MCP tool filter is the
# only place that boundary can be enforced short of writing a custom
# MCP proxy. Anything not explicitly included below is invisible to
# the agent, not merely discouraged.
#
# Tool names verified against manusa/podman-mcp-server's source
# (pkg/mcp/podman_container.go) rather than assumed from its README —
# the full container-tool surface is: container_inspect, container_list,
# container_logs, container_remove, container_run, container_stop.
# (Image/network/volume tools also exist; none are needed here.)
#
# Three separate entries, one per target VM, instead of one shared
# "podman" entry: podman-mcp no longer runs alongside hermes-agent on
# the same host (see docker-compose.podman-mcp.yml), so each instance
# is reached over MCP/TCP at its own VM's IPv6 address rather than by
# Docker-network service name. The exact IPs must be re-verified
# against `openstack server list` after every rebuild of any of the
# three target VMs — they are not guaranteed stable across a replacement.

# Primary model: Groq (free tier, 1,000 req/day on llama-3.3-70b-versatile —
# far past Gemini's free-tier 5 req/day for gemini-3.8-flash, which this
# agent hit almost immediately in real use, confirmed live via a real
# Discord interaction that still 429'd on Gemini). Groq is OpenAI-API-
# compatible, configured as `provider: custom` directly on the model:
# entry (base_url + key_env) — there is no separate top-level `providers:`
# map or `custom:<name>` provider-reference syntax; an earlier version of
# this file invented both, which Hermes silently ignored, leaving it on
# its prior Gemini-only config. Verified against the raw doc source
# (configuring-models.md's "What gets written to config.yaml" section:
# model: needs provider/default/base_url/api_mode; features/
# fallback-providers.md's "Custom Endpoint Fallback" section for the
# custom-provider shape), not an AI-summarized paraphrase of it — two
# earlier summarized fetches of the same pages each gave a different,
# wrong schema.
#
# fallback_providers is top-level, not nested under model: (also
# confirmed against the raw source) — falls back to Gemini (existing
# key) if Groq's daily cap is ever actually exhausted. Fallback is
# turn-scoped: each new message retries the primary first.
model:
  provider: custom
  default: llama-3.3-70b-versatile
  base_url: https://api.groq.com/openai/v1
  key_env: GROQ_API_KEY
  api_mode: chat_completions

fallback_providers:
  - provider: gemini
    model: gemini-3.8-flash

mcp_servers:
  podman-prod:
    url: "http://[2001:7c0:1b20:c913:1::180]:8080/mcp"
    tools:
      # Allowlist, not blocklist: podman-mcp's tool surface grows over
      # time, and a blocklist silently admits new tools on upgrade. An
      # allowlist fails closed instead.
      include:
        - container_list
        - container_inspect
        - container_logs
        # No container_run, container_stop, container_remove, and no
        # image_*/network_*/volume_* tools at all — those require a
        # human with the ubuntu/sudo login or the CI/CD pipeline,
        # never this agent directly.

  podman-staging:
    url: "http://[2001:7c0:1b20:c913:1::4a4]:8080/mcp"
    tools:
      include:
        - container_list
        - container_inspect
        - container_logs

  podman-ci:
    url: "http://[2001:7c0:1b20:c913:1::206]:8080/mcp"
    tools:
      include:
        - container_list
        - container_inspect
        - container_logs

  # HARNESS.md System 2 — github-mcp-server, activated 2026-09-23.
  # GitHub hosts the MCP server itself (no container needed). PAT scopes:
  # contents read + pull_requests read+write (for /verify-staging comments).
  # X-MCP-Readonly omitted intentionally — PR comment writes are needed.
  # Toolset restricted to repos+pull_requests only; no admin:org scope.
  github:
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${env:GITHUB_TOKEN}"
      X-MCP-Toolsets: "repos,pull_requests"

  # HARNESS.md System 2 — openstack-kr/python-openstackmcp-server,
  # planned but not yet activated. NOT avinas234/openstack-mcp (an
  # earlier draft of this file named that one): that project SSHes
  # into the OpenStack controller host itself to run CLI commands,
  # which this org does not have — only project-level clouds.yaml API
  # credentials, like any OpenStack tenant. This one uses the
  # OpenStack SDK against the REST API instead, the same access level
  # `openstack server list` already has.
  #
  # No built-in read-only mode (verified against
  # src/openstack_mcp_server/tools/*.py — get_*/create_*/delete_*/
  # update_*/action_* all coexist as plain mcp.tool() registrations).
  # Same pattern as podman-mcp: the allowlist below IS the guardrail,
  # not a flag on the server. get_* only, across compute/network/
  # identity — no create_server, no delete_*, no update_*, no
  # action_server, no attach_volume/detach_volume.
  # openstack:
  #   url: "http://openstack-mcp:PORT/mcp"  # port TBD, check the
  #                                          # project's own default
  #                                          # once actually deployed
  #   tools:
  #     include:
  #       - get_servers
  #       - get_server
  #       - get_flavors
  #       - get_networks
  #       - get_network_detail
  #       - get_subnets
  #       - get_subnet_detail
  #       - get_ports
  #       - get_port_detail
  #       - get_regions
  #       - get_region
  #       - get_domains
  #       - get_domain
  #       - get_projects
  #       - get_project
  #       # Extend with get_images/get_volumes/etc. as needed — always
  #       # verify against the current source before adding a name,
  #       # the same way podman-mcp's tool names were verified rather
  #       # than assumed (see HARNESS.md 2.1).

tool_loop_guardrails:
  # Gateway/cron sessions are unattended by definition — a runaway
  # tool loop here has no human watching to interrupt it.
  non_interactive_hard_stop_enabled: true
